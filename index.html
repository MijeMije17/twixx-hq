*{box-sizing:border-box}

button,select,input,textarea{font:inherit;color:var(--t);background:#11131a;border:1px solid var(--bd);border-radius:3px;padding:8px 12px;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible{outline:2px solid var(--r);outline-offset:1px}
button{cursor:pointer;background:var(--p2);font-weight:500}button:hover{border-color:var(--r);background:#262b38}

.tag{display:inline-block;background:#262b38;border-radius:2px;padding:1px 8px;margin:2px 3px 2px 0;font-size:12px;font-weight:500}
.bar{height:5px;background:#222634;margin:3px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--r2),var(--r))}

 {v:'2.2.21',d:'2026-10-27',t:['Gaming House : nouvel onglet « Casino » pour dépenser ses TWIXX coins. Trois jeux : machine à sous (3 rouleaux, de x6 pour trois cerises à x150 pour trois 7), roulette à 37 cases (rouge ou noir x2, vert x36) et pile ou face (x1,9). Mises de 5 à 100 coins, jamais au-dessus du solde. Un cadeau du jour de +10 coins évite de rester bloqué à 0, et l’historique garde les 8 dernières parties.','Le résultat est tiré avant l’animation et le solde est enregistré tout de suite : recharger la page en cours de partie ne permet pas d’annuler une perte. Jeu fictif : les coins n’ont aucune valeur réelle.','Important : les gains et pertes du casino sont enregistrés sur l’appareil du joueur (comme ses réglages). Le solde affiché dans Mon profil et dans le casino est donc « coins gagnés en match + résultat du casino sur cet appareil ». Le classement de l’équipe ne compte que les coins gagnés en match. Un compte admin sans joueur lié joue en mode test avec 100 coins fictifs.']},
 {v:'2.2.20',d:'2026-10-27',t:['Mon profil : ouverture et changement d’onglet plus fluides. Les blocs lourds de l’onglet Profil (Ma collection de cartes et TWIXX coins) ne bloquent plus l’ouverture : la fenêtre s’affiche tout de suite et ces deux blocs se remplissent juste après, seulement quand l’onglet Profil est visible. Le calcul des coins de toute l’équipe est mis en mémoire.','Pendant que le profil (ou toute fenêtre) est ouvert, les animations des cartes derrière sont mises en pause, ce qui allège nettement le téléphone.','Mon profil : les bulles sont espacées. Le message de l’admin n’est plus collé au bloc en dessous.']},

 {v:'2.2.18',d:'2026-10-27',t:['Cartes : moins de ralentissements et de bugs dans l’écran des cartes. Les notes et les lignes de stats de chaque joueur sont maintenant calculées une seule fois tant que les données ne changent pas (avant, elles étaient refaites plusieurs fois par carte à chaque affichage ou clic), et la liste des cartes spéciales est gardée en mémoire jusqu’à la prochaine modification.','Quand beaucoup de cartes sont affichées en même temps (plus de 9), les animations en boucle les plus coûteuses (flottement de la photo, reflet) sont coupées pour garder l’écran fluide, surtout sur mobile. Les animations d’ouverture et au survol restent.','Si un onglet des cartes rencontre une erreur, l’écran n’est plus vide ou bloqué : un message avec un bouton « Revenir aux cartes de l’équipe » s’affiche.']},

 {v:'2.2.16',d:'2026-10-27',t:['Cartes de maps : le rond affiche maintenant une image de la map (une vue artistique du jeu, pas la carte vue du dessus), récupérée sur valorant-api.com comme les images d’agents. Les images sont gardées sur l’appareil et rafraîchies une fois par semaine. Si une map n’a pas d’image (nouvelle map, hors ligne), le rond garde son emblème avec le nom.']},
 {v:'2.2.15',d:'2026-10-27',t:['Cartes : nouvel onglet « Maps du mois ». Une carte par map jouée pendant le mois, calculée sur les stats de toute l’équipe sur cette map : taux de victoire, tir, impact, utilité, K/D et ADR. La note et la rareté (Bronze à Mythique) suivent le même barème que les autres cartes. Au verso : les meilleurs joueurs de l’équipe sur la map, les agents les plus joués et la liste des matchs du mois. Un sélecteur permet de revoir les mois précédents. Moins de 2 matchs sur une map : la carte est marquée provisoire.']},
 {v:'2.2.14',d:'2026-10-27',t:['Cartes sur mobile : une carte par ligne au lieu de deux, centrée et plus grande. Les notes ne sont plus coupées, les badges (Roi de map, Série de victoires, Ace) s’affichent en entier, et la note, le nom, la photo et les barres de stats sont plus lisibles. Les cartes spéciales et les petites cartes de comparaison gardent leur taille.']},
 {v:'2.2.13',d:'2026-10-27',t:['Cartes spéciales : l’admin peut maintenant créer à la main des cartes Ace, comme les cartes Clutch. Bouton « + Carte ace » dans l’onglet des cartes spéciales : joueur, match (facultatif), nombre d’aces, round et description. Les cartes Ace créées se modifient et se suppriment depuis leur verso. Si une carte Ace existe déjà pour un joueur sur un match, celle générée automatiquement à partir des stats n’est pas affichée en double.']},
 {v:'2.2.12',d:'2026-10-27',t:['Cartes de match (Tournoi, Playoff, Compétition) : la note ne dépend plus de ta régularité ni de ta moyenne habituelle. Elle ne mesure que ton utilité sur ce match précis : tir, impact et utilité du match, plus un K/D comparé à celui de ton équipe sur ce même match (la barre MEN). Les cartes de Practice gardent le calcul précédent.']},
 {v:'2.2.11',d:'2026-10-27',t:['Cartes : titres et badges gagnés selon les stats, affichés sous le nom sur la carte générale (jusqu’à 2). « Roi de [map] » (meilleur K/D sur une map avec au moins 3 matchs et un K/D d’au moins 1,15), « Série de N victoires » (3 victoires d’affilée ou plus, sur les derniers matchs), « Ace × N » (3 aces ou plus), « Roi de l’entrée » (écart de premiers duels élevé sur 5 matchs ou plus). Les cartes réduites et les cartes de match n’en affichent pas.','Cartes : animation d’ouverture. La première fois qu’une carte s’affiche, elle se retourne en arrivant, en même temps que le décompte de la note. Coupée avec « Animations : Réduites » et le réglage système « réduire les animations ».','Patch notes : l’onglet À venir est mis à jour, ce qui est livré en est retiré.']},
 {v:'2.2.10',d:'2026-10-27',t:['Données › nouvel onglet « Historique & corbeille » (admin) : le site garde automatiquement jusqu’à 4 copies récentes de tes données sur cet appareil (au plus une toutes les 30 minutes, seulement si quelque chose a changé). Tu peux revenir à une version précédente en un clic ; l’état actuel est d’abord mis de côté, donc le retour en arrière est lui-même annulable. Bouton « Enregistrer une copie maintenant ».','Corbeille de 30 jours : un match, un joueur, une composition, un plan, une préparation ou un adversaire supprimé n’est plus perdu. Il est conservé 30 jours dans l’onglet Historique & corbeille, d’où on peut le restaurer ou le supprimer pour de bon.','Données › Sauvegarde : import de matchs en lot depuis un fichier CSV (colonnes date, adversaire, map, score, type, côté ; séparateur « ; », « , » ou tabulation). Un modèle est téléchargeable, les doublons (même date, adversaire et map) et les lignes invalides sont ignorés, et un récapitulatif est demandé avant d’ajouter quoi que ce soit.','Cartes : la note sur 99 se décompte maintenant de 0 jusqu’à sa valeur la première fois qu’une carte s’affiche. Coupé avec les animations « Réduites » et le réglage système « réduire les animations ».','Patch notes : l’onglet À venir est mis à jour, ce qui est livré en est retiré.']},
 {v:'2.2.9',d:'2026-10-27',t:['Statistiques › nouvel onglet « Synergies » : duos de joueurs (taux de victoire quand deux joueurs jouent le même match), compositions (taux de victoire par map et par groupe d’agents), meilleures combinaisons joueur + agent + map (victoires, K/D) et stats par rôle (duelliste, initiateur, contrôleur, sentinelle) pour voir dans quel rôle chaque joueur rend le mieux. Les filtres de map et de type de match de la page s’appliquent. Les lignes reposant sur peu de matchs sont indiquées.','Préparation : chaque fiche affiche maintenant une prévision simple de victoire, calculée d’après le taux de victoire de l’équipe, l’historique contre cet adversaire et les résultats sur chaque map envisagée. C’est une estimation indicative, sa fiabilité est indiquée.','Matchs : détection des doublons à la saisie. Si un match existe déjà à la même date, contre le même adversaire et sur la même map, le site demande confirmation avant d’enregistrer.','Matchs : nouveau bouton « Résumé Discord » à côté de « Dupliquer ». Il copie un résumé prêt à coller (résultat, score, map, stats des joueurs, meilleur K/D et VOD).','Mon profil › Style › Animations : nouveau réglage « Légères » entre « Activées » et « Réduites ». Il coupe les effets décoratifs en boucle (reflets des cartes, étincelles, mascottes) mais garde les transitions et l’inclinaison des cartes.','Patch notes : l’onglet À venir est mis à jour, ce qui est livré en est retiré.']},
