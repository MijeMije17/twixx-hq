 {v:'1.9.8',d:'2026-10-26',t:['Mobile : correction des cartes du Centre du staff qui débordaient à droite et des priorités mal découpées, flèche des quartiers remise à côté du titre, et retrait des phrases de présentation (quartiers et chats) sur téléphone, elles restent sur ordinateur.','La Gaming House sur ordinateur : onglets avec icônes et barre collante, filtres de quartier collants, priorités du staff en grille, indicateurs et cartes plus soignés (survol, accent de couleur par chat), apparition en douceur.','La Gaming House sur mobile : onglets collants avec icônes et Centre du staff repensé. Bandeau compact, indicateurs à faire glisser, priorités du staff en cartes swipables, filtres de quartier collants et centrés automatiquement, quartiers repliables (ceux avec des alertes s’ouvrent seuls), cartes plus compactes avec actions faciles à toucher. Version ordinateur inchangée.']},
 {v:'1.9.7',d:'2026-10-26',t:['Centre du staff : Kiwi rejoint l’équipe comme préparatrice physique et kiné. Chatte écaille de tortue (orange, noir et crème) au visage clair, avec une grande tache noire autour de l’œil droit et des yeux jaune-vert, elle porte un collier vert avec une croix blanche. Elle s’occupe du corps : échauffement des poignets et des mains les jours de match ou de séance, étirements après un match, jours enchaînés sans repos, journées sans séance pour bouger doucement et un conseil physique du jour (posture, poignets, pauses).','Elle est rangée dans le Pôle bien-être avec Naya et Simba. Elle ne parle ni de mental ni de sommeil (Naya), ni d’alimentation ni d’eau (Simba), et elle ne pose aucun diagnostic : en cas de douleur qui dure, elle renvoie vers un médecin ou un kiné.','Comme les autres, tu peux la caresser, l’activer ou la masquer dans Mon profil › Options, et l’admin règle son activation dans Données › Mascottes (avec aperçu). Elle est activée par défaut.']},
 {v:'1.9.6',d:'2026-10-26',t:['Centre du staff : Whisky rejoint l’équipe comme analyste de données. Chat roux et blanc aux yeux ambrés, il porte un collier bleu avec un pendentif en forme de graphique. Il s’occupe des chiffres : bilan global avec fourchette réaliste, comparaison par type de match, écart moyen de rounds, moyennes d’équipe, tendances de K/D, forme sur 5 matchs, fiabilité et trous dans l’historique, vérifications à traiter.','Le quartier « Staff technique » est séparé en deux : Les coachs (Bloom, Platine, Mimine) et Les analystes (Bijou, Whisky). Le filtre en haut de la page propose chaque quartier.','Les chats se répètent moins. Bijou garde le jeu (maps, compos, adversaires, scouting) et passe à Whisky les chiffres, les tendances, la fiabilité et les données manquantes (les stats vides du dernier match restent à Bady). Mimine laisse les séries à Minouche et à Bady. Quand Bloom, Naya, Minouche et Mimine parlent du même prochain match, seuls les deux premiers l’affichent en tête, les autres passent à un autre message (le leur reste disponible avec « Autre conseil »). Bijou a aussi gagné un regard de l’analyste du jour.','Comme les autres, tu peux le caresser, l’activer ou le masquer dans Mon profil › Options, et l’admin règle son activation dans Données › Mascottes (avec aperçu). Il est activé par défaut.']},
 {v:'1.9.5',d:'2026-10-26',t:['Centre du staff : Mimine rejoint l’équipe comme coach adjoint. Chat noir et blanc à poil court et aux yeux jaune-vert, avec la liste blanche entre les yeux, le museau blanc et une petite tache noire sur le nez, il porte un sifflet autour du cou. Il s’occupe du moral du vestiaire à sa manière : une vanne les jours de match, une vanne après une victoire ou une défaite récente, une vanne sur les séries de victoires ou de défaites, et la vanne du jour. Sa spécialité : les deux trous du cul, qu’il place partout (« ils nous ont battus, et nous on leur fait le second »).','Il ne parle ni de stats, ni de plans, ni de planning, ni de mental, ni de nutrition : ça reste le travail des autres. Il est rangé dans le Staff technique, à côté de Bloom, Platine et Bijou.','Comme les autres, tu peux le caresser, l’activer ou le masquer dans Mon profil › Options, et l’admin règle son activation dans Données › Mascottes (avec aperçu). Il est activé par défaut.']},
 {v:'1.9.4',d:'2026-10-26',t:['Centre du staff : les chats sont maintenant rangés par quartier, comme dans une vraie gaming house. Direction (Iroise, Bady), Staff technique (Bloom, Platine, Bijou), Pôle bien-être (Naya, Simba) et Pôle communauté (Minouche). Chaque quartier explique en une phrase comment ses membres se complètent et affiche son nombre de points à traiter.','Le filtre en haut permet de n’afficher qu’un quartier (ou toute la maison). Un quartier dont tous les chats sont désactivés dans Mon profil n’apparaît plus.']},
 {v:'1.9.3',d:'2026-10-26',t:['Centre du staff : Platine rejoint l’équipe comme coach stratégique. Chatte calico (blanche, orange et noire) au masque noir sur un œil, elle s’occupe de la tactique : maps jouées sans plan, maps sans compo de référence, compos sauvegardées jamais testées en match, compo trop répétée (adversaires qui s’adaptent), plan de jeu contre un adversaire, ajustement noté après un match et conseil tactique du jour. Elle rappelle aussi, avec fierté, qu’elle a un meilleur rang sur Valorant que Zeph, Nwadekajou et Lipton.','Les plans et priorités tactiques passent de Bloom à Platine. Bloom garde le planning, les entraînements et la préparation avant match.','Comme les autres, tu peux la caresser, l’activer ou la masquer dans Mon profil › Options, et l’admin règle son activation dans Données › Mascottes (avec aperçu). Elle est activée par défaut.']},
 {v:'1.9.2',d:'2026-10-26',t:['Centre du staff : Iroise rejoint l’équipe comme directrice sportive. Chatte calico (blanche, orange et tigrée) aux yeux jaune-vert, elle regarde le club de plus haut : points de qualification playoff (combien de victoires en tournoi il reste à décrocher), quota de tournois dépassé dans le planning, structure du roster (IGL, rôles non couverts, remplaçants), staff manquant, calendrier déséquilibré sur 30 jours, bilan du mois comparé au mois précédent et conseil du jour.','Le roster incomplet passe de Bady à Iroise : Bady reste sur l’exigence individuelle, Iroise sur la structure du club. Elle ne parle ni de K/D, ni de maps, ni de nutrition.','Comme les autres, tu peux la caresser, l’activer ou la masquer dans Mon profil › Options, et l’admin règle son activation dans Données › Mascottes (avec aperçu). Elle est activée par défaut.']},
 {v:'1.9.1',d:'2026-10-26',t:['Centre du staff : deux nouveaux membres rejoignent l’équipe. Minouche (chat tigré doré aux yeux verts, joueur et plein d’énergie) est le community manager : pronostics en attente, défi du jour, classement des pronostics, séries et aces à célébrer, caps de matchs, idées de contenus et mise en avant d’un joueur. Il prépare aussi des textes de posts prêts à copier (victoire, annonce, série, ace) avec le bouton « Copier le texte », ne publie jamais rien tout seul et n’y met ni reproches ni stats détaillées.','Simba (chat tigré gris-brun aux yeux jaune-vert, bandana vert et pomme) est le nutritionniste : il calcule ses conseils sur le planning. Dernier repas conseillé avant l’heure du match, veille de match, collations de tournoi, hydratation, séance tardive sans café, repas après un match et conseil du jour. Pas de régime ni de calories, et il ne remplace pas un professionnel de santé.','Le moteur d’analyse des chats est refait : messages classés par priorité réelle (alertes d’abord, puis urgence), sans doublon, phrases qui varient d’un jour à l’autre, fourchettes de confiance sur les % de victoires par map (Bijou), tendances de K/D sur les 3 derniers matchs, adversaires qui posent problème, fiabilité des données, compte à rebours de préparation (Bloom) et « Synthèse du jour » en haut du Centre du staff.','Les chats ne se répètent plus : Naya garde le mental et le sommeil, Bijou les maps, Bloom le planning, Bady l’exigence, Minouche la vie du salon (les pronostics passent de Bady à Minouche) et Simba l’alimentation et l’eau.','Comme les autres, tu peux les caresser, les activer ou les masquer dans Mon profil › Options, et l’admin règle leur activation dans Données › Mascottes (avec aperçu). Ils sont activés par défaut.']},
 {v:'1.9.0',d:'2026-10-25',t:['Planning refait. Sur mobile, le mois s’affiche en pastilles de couleur : touche un jour et son détail s’ouvre juste en dessous (heure, titre, type, notes, map de la semaine) au lieu d’une fenêtre. Le jour choisi est entouré, et le bouton « + Ajouter » (admin) est dans le détail.','Planning : nouveau type « Playoff » en orange vif, avec un liseré plus épais (et une pastille en losange sur mobile) pour qu’il se distingue du Tournoi, aussi bien sur PC que sur mobile. Les matchs Playoff saisis dans l’onglet Matchs prennent la même couleur.','Planning : la légende devient des filtres. Touche un type (Entraînement, Match, Tournoi, Playoff…) pour le masquer ou l’afficher dans le calendrier.','Compositions : barre d’onglets collante et défilante sur mobile, bouton de création raccourci. « Mes compos » gagne un filtre par map et affiche le bilan en match de chaque compo.','Maps : sélecteur rapide de maps avec pastille de verdict (point fort, à travailler…), Map pool repliable, et plans stratégiques en cartes dépliables qui n’affichent que les champs remplis.','Préparation : chaque préparation est une carte dépliable avec sa barre de progression en en-tête (les préparations terminées se replient), un résumé en grille, des cases à cocher plus grandes, « Tout déplier / Tout replier ». Les fiches Adversaires sont dépliables elles aussi, et le Comparateur défile proprement sur mobile.','Vérifications refait : bandeau de synthèse (à vérifier, infos, corrigeables automatiquement), filtres par catégorie, cartes plus lisibles avec boutons d’action larges.']},
 {v:'1.8.9',d:'2026-10-25',t:['Bady ne réclame plus les stats d’un joueur qui n’a pas joué le match. Il ne relève que les joueurs qui figurent dans le match (titulaires ou remplaçants) mais dont les stats sont vides. Un joueur remplacé par un remplaçant n’est plus accusé.','Barre du bas sur mobile : le sélecteur d’onglets épinglés est entièrement refait (Mon profil › Options › Barre du bas). Un aperçu montre ta vraie barre avec ses 4 emplacements plus « Plus ». Touche un emplacement pour le sélectionner, puis touche une page dans la liste pour la mettre à cet endroit (si elle était déjà épinglée ailleurs, les deux pages échangent leur place). Les boutons « Gauche » et « Droite » règlent l’ordre, « Retirer » vide l’emplacement, et plus rien ne disparaît au premier toucher. Le changement s’applique tout de suite à la vraie barre.','Correction : l’ancien sélecteur dépassait de l’écran sur le côté (le 4e onglet était coupé).']},
 {v:'1.8.8',d:'2026-10-25',t:['Mobile : tu choisis maintenant toi-même les pages épinglées dans la barre du bas (jusqu’à 4). Va dans Mon profil › Options › Barre du bas : touche une page épinglée pour la retirer, touche une page disponible pour l’ajouter, et « Par défaut » remet Dashboard, Roster, Planning et Matchs. Les pages non épinglées restent dans « Plus ».','Mobile : la recherche est refaite aux couleurs du site : plein écran avec en-tête, champ à angle coupé et accent rouge, bouton « Ajouter » pour créer rapidement, résultats en grandes lignes faciles à toucher.','Mobile, admin : dans Mon profil, le bloc « Voir le site comme un joueur » n’est plus collé au bloc Compte (déconnexion), et son bouton est plus grand.','Mini-jeux sur mobile : les images d’agents se chargent beaucoup plus vite. Le site utilise la petite version des icônes, les précharge en tâche de fond dès l’ouverture sur mobile, et se connecte à l’avance au serveur d’images.','Staff : les quatre chats ne se répètent plus, chacun garde son domaine. Bloom : planning, entraînements, préparation et objectifs de travail (cartes sans plan ni compo). Bijou : chiffres des maps, compos, forme, scouting et qualité des données. Naya : mental, routine avant match, retour après une défaite ou une victoire, repos. Bady : exigence et responsabilités.','Bady accuse maintenant, sans filtre et nommément, d’après les chiffres saisis : joueurs sous 1 de K/D, ADR trop bas, premiers à mourir trop souvent, ceux qui ont le moins pesé dans une défaite ou une série de défaites, stats manquantes par joueur, débrief vide, joueurs qui n’ont pas répondu aux pronostics, roster incomplet. Il félicite sèchement le meilleur joueur. Les chiffres viennent du site : si un chiffre est faux, corrige la saisie.']},
 {v:'1.8.7',d:'2026-10-25',t:['Gaming House › Salon en direct : si ton appareil n’est pas encore connecté, une carte te demande tout de suite le jeton (et le lien du gist) pour pouvoir discuter en direct, répondre aux pronostics et partager tes records. Sur mobile, une barre « Appareil connecté » avec un bouton « Réglages de connexion » reste disponible en haut du salon.','Pronostics, correction sur mobile : on ne pouvait pas répondre. Le résultat et le MVP se choisissent maintenant avec de gros boutons (au lieu des menus déroulants qui se refermaient quand la page se rafraîchissait), le score se saisit sans devoir quitter le champ, la page ne se rafraîchit plus pendant que tu réponds, et si ton appareil n’est pas connecté un bouton « Connecter cet appareil » t’amène directement aux réglages.','Mini-jeux : nouveau design aux couleurs du site (angles coupés, accent rouge, titres en majuscules espacées). Bandeau d’accueil avec tes records et tes défis relevés, cartes numérotées avec leur durée, fenêtre de jeu plein écran sur mobile avec en-tête fixe, zone de jeu avec repères d’angle, compteurs plus lisibles, réponses du quiz repérées par une lettre A B C D, cartes de mémoire et écran de fin dans le même style.','Centre du staff entièrement revu, sur ordinateur et sur téléphone : bandeau d’accueil, indicateurs (à traiter, conseils, bonnes nouvelles, prochain rendez-vous), liste des priorités de tout le staff avec bouton « Voir », puis une fiche par membre (Bloom, Bijou, Naya, Bady) avec son rôle, sa spécialité, son message du moment, « Autre conseil », « Voir » et « Caresser ». Des pastilles permettent de n’afficher qu’un membre, et les membres du staff saisis dans le Roster apparaissent en dessous.']},
 {v:'1.8.6',d:'2026-10-25',t:['Bady est redessiné pour mieux lui ressembler, d’après ses photos et l’illustration : poil long et joues touffues, grandes oreilles noires, calotte noire avec le liseré blanc qui descend entre les yeux, œil gauche dans la tache noire, museau, menton et poitrail blancs. Il porte maintenant une cape bleu nuit et le pendentif à pierre bleue de l’illustration, à la place de la cravate.']},
 {v:'1.8.5',d:'2026-10-25',t:['Bady est redessiné : il est maintenant noir et blanc (plus de brun). Les deux oreilles, le haut de la tête, la joue droite et tout le tour de l’œil gauche sont noirs, si bien que son œil gauche est plongé dans le noir. Le museau, la poitrine et la cravate sont inchangés.']},
 {v:'1.8.4',d:'2026-10-25',t:['Centre du staff : Bady rejoint l’équipe comme manager d’équipe. Chat à poil long, noir et blanc, il est le gérant du club et dit les choses directement. Il est là pour « clasher » : ses messages sont francs et sans détour, calculés à partir des données du site. Il relève par exemple un roster qui n’est pas à 5 joueurs actifs, une préparation incomplète avant un match proche, une défaite sans débrief, une map qui perd trop souvent, des matchs sans statistiques, une série de défaites ou un planning vide, et il félicite sèchement après une victoire.','Bady vise les problèmes, jamais une personne en particulier, et il ne modifie rien. Comme les autres, tu peux le caresser (bouton « Caresser Bady »), l’activer ou le masquer dans Mon profil › Options, et l’admin règle son activation par défaut dans Données › Mascottes (avec son aperçu). Il est activé par défaut ; les réglages déjà faits ne changent pas.']},
 {v:'1.8.3',d:'2026-10-25',t:['Centre du staff : un nouveau membre rejoint Bloom (le coach) et Bijou (l’analyste) : Naya, chat tigré gris aux yeux verts, psychologue du sport et mental coach. Elle donne des conseils courts sur le mental calculés à partir des données du site : routine avant un match ou un tournoi à venir, recul après une défaite ou une série de défaites, moment de reconnaissance après une victoire, repos et récupération quand il n’y a rien de prévu, et un rappel du jour qui change chaque jour. Elle ne modifie jamais rien et ne remplace pas un vrai professionnel : si quelqu’un ne va pas bien, il vaut mieux en parler à une personne de confiance.','Comme pour Bloom et Bijou, tu peux la caresser (bouton « Caresser Naya »), l’activer ou la masquer dans Mon profil › Options, et l’admin peut régler son activation par défaut pour l’équipe dans Données › Mascottes (avec son aperçu). Les réglages déjà faits pour Bloom et Bijou ne changent pas : Naya est activée par défaut.']},
 {v:'1.8.2',d:'2026-10-25',t:['Gaming House : le sous-onglet « Bloom et Bijou » s’appelle maintenant « Centre du staff ». Son contenu ne change pas.','Gaming House › Mini-jeux : nouveau classement entre les joueurs, sous les cinq jeux. Un classement général (points par jeu : le meilleur de chaque jeu marque le plus de points) et un classement par jeu (Aim Lab, Réflexes, Mémoire, Quiz) avec médailles. Les meilleurs records de chacun sont partagés dans le gist de la Gaming House : ils sont envoyés tout seuls quand tu bats un record (et une fois à l’ouverture de l’onglet pour tes anciens records), et un bouton « Envoyer mes records » force l’envoi. Il faut avoir le jeton de la Gaming House sur son appareil, comme pour les pronostics.','Roster : la saisie des agents d’un joueur est refaite. Tous les agents sont affichés, rangés par rôle avec leur portrait : il suffit de taper un niveau de 1 à 5 sous chacun (0 = interdit, case vide = non renseigné). Un compteur indique combien d’agents sont renseignés et « Tout effacer » remet tout à zéro. Les niveaux déjà saisis sont repris tels quels. Correction : un niveau 0 est maintenant bien gardé comme « interdit » (il était transformé en 1).','Les portraits des agents apparaissent aussi sur les fiches du Roster (meilleurs agents du joueur) et dans « Ton agent du jour » du Défi du jour.','Mini-jeu Mémoire des agents : les cartes affichent maintenant le portrait de chaque agent (images officielles, chargées une fois puis gardées sur l’appareil). Sans connexion, les cartes restent en texte comme avant.','Quota de tournois : l’équipe ne peut faire que 2 tournois par semaine (du lundi au dimanche). Le site compte les événements « Tournoi » du planning et les matchs saisis de type Tournoi (un même jour n’est compté qu’une fois). Un tournoi au-delà du 2e n’est plus annoncé comme « match demain » : ni par Bloom, ni par les rappels du jour et du lendemain, ni par le conseil « Match proche ». Les créneaux de tournoi en plus restent dans le planning (ils servent seulement à lancer un tournoi tant que le quota n’est pas fait) : ils sont simplement ignorés, sans alerte.','Bloom : quand il n’y a aucun match à venir dans les 7 jours (ou que le quota est atteint), il souhaite bon repos avec un message qui change chaque jour, et rappelle le prochain entraînement (« À mercredi pour les pracs ! »).']},
 {v:'1.8.1',d:'2026-10-25',t:['Gaming House : la création de pronostics ne se limite plus aux matchs. Le bloc « Créer un pronostic » propose maintenant des questions et sondages : « Oui / Non » (ex. « Ce joueur sera-t-il là la semaine prochaine ? ») ou « Choix multiple » avec tes propres réponses (un bouton « Joueurs du roster » remplit la liste avec les joueurs). Tu fixes la date et l’heure de fin (ou un raccourci « dans 1, 2, 3, 4 ou 7 jours ») et le nombre de points d’une bonne réponse.','Un sondage affiche un compte à rebours (« se termine dans 3 j 4 h »), se ferme tout seul à l’échéance, puis révèle les réponses de chacun avec le nombre de votes par réponse. L’admin saisit la bonne réponse avec « Résultat » : les points vont au classement des pronostics, comme pour les matchs. Les pronostics de match existants ne changent pas.','Gaming House : la page est découpée en sous-onglets comme dans Préparation : Salon en direct, Pronostics (avec le nombre de pronostics ouverts auxquels tu n’as pas encore répondu), Mini-jeux et Bloom et Bijou. Le dernier onglet ouvert est retenu.','Adversaires devient un sous-onglet de Préparation (Préparations, Adversaires, Comparateur) et n’apparaît plus dans le menu. Les anciens liens, la recherche rapide et les boutons « → Préparation » / « Fiche adversaire » continuent de fonctionner.']},
 {v:'1.8.0',d:'2026-10-25',t:['Gaming House : nouvelle section « Mini-jeux » pour se détendre entre deux scrims, placée juste sous le salon en direct. Cinq jeux : Aim Lab (30 secondes pour toucher un maximum de cibles), Réflexes (touche dès que l’écran passe au vert, moyenne sur 5 essais), Mémoire des agents (retrouve les 8 paires), Quiz agents et maps (10 questions sur les rôles des agents et sur vos matchs) et Défi du jour (map et défi d’équipe identiques pour tout le monde, agent du jour différent pour chacun).','Les jeux s’ouvrent dans une fenêtre à eux (plein écran sur mobile) avec de grandes zones tactiles : le salon en direct qui se met à jour ne les interrompt pas. Tes records sont gardés sur ton appareil et affichés sur chaque carte.']},
 {v:'1.7.8',d:'2026-10-25',t:['Mobile : le menu « Plus » est refait, plus moderne : les pages sont rangées par catégorie (Jeu, Analyse, Détente, Outils), en grandes cartes arrondies avec une courte description, une icône dans une pastille et des badges bien visibles. La page ouverte est mise en valeur.','Mobile : la barre du bas montre maintenant clairement la page active grâce à une bulle colorée derrière l’icône et le nom, qui apparaît avec une petite animation. Quand tu es sur une page du menu « Plus » (Statistiques, Maps…), c’est le bouton « Plus » qui s’illumine.','Profil : l’onglet « Mon profil » est refait, plus doux et plus clair (mobile et ordinateur) : grande carte avec ta photo (toucher la photo pour la changer), onglets en bloc arrondi, réglages rangés en cartes par thème avec des choix en boutons discrets, bouton « Se déconnecter » dans une section Compte. Le rond de profil en haut à droite sur mobile et la puce de profil du menu sur ordinateur sont redessinés : rond propre dans une pastille, nom et rôle lisibles, sans gros badge rouge.','Compatibilité : les zones colorées (page active dans la barre du bas, choix sélectionné dans le profil, cartes du menu « Plus ») s’affichent maintenant aussi sur les téléphones et navigateurs un peu plus anciens, où elles restaient invisibles.']},
 {v:'1.7.7',d:'2026-10-25',t:['Détail d’un match : un joueur qui n’est pas titulaire dans le Roster (remplaçant) reçoit maintenant une étiquette « Remplaçant » à côté de son pseudo dans le tableau de stats. Le statut est mémorisé à l’enregistrement du match, il ne change pas si le joueur devient titulaire plus tard.','Mobile : les encadrés « Comment ça marche ? » sont supprimés.','Mobile : affichage plus arrondi et plus moderne : cartes aux coins arrondis, boutons et champs arrondis, onglets en pastilles, barre du bas flottante avec pastille sur la page active.','Mobile : ambiance plus douce, moins agressive : fond plus clair, plus de quadrillage ni de lueur rouge, rouge réservé aux actions principales, pastilles et badges adoucis, ombres légères.','Mobile : navigation plus intuitive : la barre du haut affiche le titre de la page avec une courte description, le bouton d’ajout est devenu « ＋ Ajouter » avec son libellé, boutons plus grands pour le doigt.','Tuto d’installation : une carte « Installe l’application » apparaît sur le Dashboard mobile (masquable), et un bouton « Installer l’application » est dans le menu Plus et dans Mon profil › Notifs. Le tuto explique d’ouvrir le site dans Chrome, puis les étapes Android (menu ⋮ › Installer l’application) et iPhone (Partager › Sur l’écran d’accueil).']},
 {v:'1.7.6',d:'2026-10-25',t:['Gaming House : les cases « Lien du gist » et « Jeton GitHub » ne sont plus remplies par le gestionnaire de mots de passe du navigateur (qui y mettait l’ancien identifiant ou mot de passe de connexion). Elles restent vides tant que tu ne colles rien.']},
 {v:'1.7.5',d:'2026-10-25',t:['Gaming House : c’est toi, l’admin, qui crées les pronostics. Un nouveau bloc « Créer un pronostic » liste les matchs et tournois du planning : un clic sur « Créer » (ou « Tout créer ») génère le pronostic avec le titre, la date et l’heure déjà remplis. Tu peux aussi créer un pronostic libre (scrim, match amical…) avec un titre, une date et une heure.','Chaque pronostic peut être modifié, clôturé, rouvert ou supprimé par l’admin. Le bouton « Résultat » permet de saisir à la main le résultat, le score et le MVP ; sinon ils sont repris du match saisi à la même date. Les pronostics se ferment au début du match et les choix de chacun sont alors révélés. Les pronostics sont stockés dans le gist de la Gaming House, les joueurs les reçoivent sans republier.','Nouveau « Salon en direct » : tu vois en temps quasi réel qui est connecté en même temps que toi (avatars, compteur, liste des hors ligne) et tu peux discuter. Quand quelqu’un écrit, une bulle de dialogue apparaît au-dessus de sa photo de profil pendant quelques secondes, et l’historique des messages (6 dernières heures) reste en dessous. Des boutons rapides (GG, 🔥, 😂…) envoient un message en un clic.','Fonctionnement : le salon utilise le service gratuit ntfy.sh. Le canal est secret : son nom est calculé à partir du jeton de la Gaming House, donc seuls ceux qui ont le jeton y accèdent. Aucun message n’est enregistré dans tes données ni dans le gist. Un nouveau pronostic ou un résultat déclenche aussi une mise à jour immédiate chez les joueurs connectés.']},
 {v:'1.7.4',d:'2026-10-24',t:['La Gaming House devient connectée : elle a son propre gist GitHub (gaminghouse.json), séparé de celui des données de l’équipe. Dès qu’un joueur y enregistre quelque chose, le gist change et tout le monde le reçoit sans que personne ait à republier : la page se met à jour toute seule (environ toutes les 1 à 2 minutes, et le bouton « Actualiser » force la mise à jour).','Premier ajout : les pronostics entre potes. Pour chaque match ou tournoi du Planning, chaque joueur pronostique le résultat, le MVP et, en option, le score exact. Les choix restent cachés jusqu’au début du match, puis les points sont attribués quand le résultat est enregistré (résultat +3, MVP +2 = meilleur K/D du match, score exact +3) et un classement des pronostics se remplit.','Mise en place : crée un compte GitHub dédié, un gist gaminghouse.json et un jeton avec la seule permission « gist », puis colle le lien et le jeton dans La Gaming House. Le lien du gist est partagé avec l’équipe via les données publiées, le jeton reste sur chaque appareil et se transmet aux joueurs en privé. N’utilise pas le jeton de ton compte principal.']},
 {v:'1.7.3',d:'2026-10-24',t:['Roster : les rôles s’affichent mieux. Chaque joueur a maintenant des pastilles colorées : rôle principal (⚔️ Duelist, 📡 Initiator, 🌫️ Controller, 🛡️ Sentinel, 🔀 Flex), rôles secondaires (en plus clair) et fonctions en jeu (🧠 IGL, 🚪 Entry, 🕶️ Lurker, 🤝 Support, ⚓ Anchor, 🎯 Sniper, 🧊 Clutcher).','Nouveau champ « Fonctions en jeu » dans la fiche joueur (ex. IGL, Entry, Lurker). Les mots déjà écrits dans le champ « Style » sont reconnus aussi, rien à ressaisir. Les rôles secondaires sont lus dans le champ « Rôles secondaires » (français ou anglais).','Bloc « Équipe active » : une case par rôle avec les joueurs qui le tiennent (et ceux qui peuvent le dépanner), une ligne des fonctions en jeu, et une alerte s’il n’y a aucun IGL ou plusieurs IGL. Nouveau filtre par fonction et tri par rôle (Duelist → Flex, IGL en premier). Les pastilles apparaissent aussi sur le Dashboard et pour les invités.','Statistiques › Styles de jeu : 10 nouveaux styles, soit 32 au total (Chef d’orchestre, Sniper, Clutcheur, Finisseur, Bouclier, Ouvreur-soutien, Locomotive, Montée en puissance, Joueur de gros matchs, Joueur de scrim). Le style tient compte des fonctions déclarées dans le Roster, de la forme récente et des résultats en matchs importants (Tournoi, Playoff) comparés aux autres matchs.','Nouvel onglet « La Gaming House » (menu Détente) : Bloom et Bijou y déménagent et ne s’affichent plus sur le Dashboard ni sur les autres pages. Chacune a sa grande carte avec ses conseils (bouton « Autre conseil », lien « Voir » vers la page concernée) et un bouton 🐾 pour la caresser. C’est un onglet à part, pensé pour accueillir d’autres ajouts plus tard.','Les réglages des mascottes restent (activer ou masquer chacune, conseils automatiques, dans Mon profil › Options et Données › Mascottes), mais l’option « Emplacement » disparaît puisqu’elles ont désormais leur propre onglet. Le profil invité ne voit toujours pas l’onglet.']},
 {v:'1.7.2',d:'2026-10-24',t:['Correctif Statistiques : le tri par Kills, Morts et Assists (boutons et en-têtes de colonnes du tableau « Kills, morts et assists ») fonctionne de nouveau. Il provoquait l’erreur « Assignment to constant variable » à cause d’un nom de variable utilisé deux fois. Le lien de mise à jour partagée n’est pas affecté.','Nouvel onglet Statistiques › Styles de jeu : chaque joueur reçoit un style principal et un style secondaire parmi 22 profils (Ouvreur, Tête brûlée, Carry, Duelliste explosif, Chasseur de têtes, Chirurgien, Faiseur de highlights, Artilleur, Rôdeur, Survivant, Pilier, Facilitateur, Équipier de trade, Éclaireur, Architecte, Ancre, Métronome, Montagnes russes, Polyvalent, Spécialiste, Tout ou rien, Profil équilibré).','Le style est déduit des stats (K/D, ADR, KAST, headshots, premiers kills et premières morts, multi-kills, kills, morts et assists par match, régularité) comparées à la moyenne de l’équipe, et du gameplay réel (rôles et agents joués en match). Chaque carte indique les raisons du style. Il faut au moins 3 matchs ; les filtres de map et de type de match s’appliquent. Une légende liste tous les styles.']},
 {v:'1.7.1',d:'2026-10-24',t:['Mascottes : chaque joueur peut désormais régler Bloom et Bijou lui-même, comme l’admin. Dans Mon profil › Options, section « Mascottes » : activer ou masquer chaque mascotte, activer ou couper les conseils automatiques, choisir l’emplacement (Dashboard seul, pages pertinentes, mode discret).','Chaque réglage peut suivre le réglage de l’équipe (défini par l’admin dans Données › Mascottes) ou être remplacé par ton choix personnel. Tes choix restent sur ton appareil, comme le thème : ils ne modifient aucune donnée du site et ne sont pas partagés.','Le bouton « Revenir au réglage de l’équipe » efface tes choix personnels. Le profil invité ne voit toujours pas les mascottes.']},
 {v:'1.7.0',d:'2026-10-24',t:['Nouveau : les mascottes Bloom (chat noir, le coach) et Bijou (chat siamois aux yeux bleus, l’analyste) donnent des conseils courts sur le Dashboard. Elles ne modifient jamais tes données et le profil invité ne les voit pas.','Bloom rappelle le prochain match et le prochain entraînement du planning, signale les préparations incomplètes, remet en avant les priorités tactiques saisies, propose un objectif de travail (map la plus faible à partir de 3 matchs) et encourage l’équipe après une défaite récente.','Bijou calcule ses remarques sur tes données (victoires par map, compos les plus jouées, forme récente, données manquantes, fiches adverses, points de Vérifications) et indique toujours le nombre de matchs concernés et les limites. Il n’invente aucune statistique et ne présente pas une corrélation comme une preuve.','Admin : nouvel onglet Données › Mascottes pour activer Bloom et Bijou séparément, activer ou couper les conseils automatiques, et choisir leur emplacement (Dashboard uniquement, pages pertinentes, ou mode discret avec petites icônes). Ces réglages sont dans les données du site : exporte le JSON et publie (⬆) pour que les joueurs les reçoivent.','Interne : la checklist de l’onglet Préparation est désormais calculée par une fonction commune, utilisée aussi par Bloom (résultat identique).']},
 {v:'1.6.2',d:'2026-10-24',t:['Nouveau profil Invité : sur l’écran de connexion, le bouton « Entrer en invité » ouvre le site sans pseudo ni mot de passe, en lecture seule. L’invité ne voit que le Dashboard (qualification playoff, classement, victoires, série, derniers résultats), le Roster (pseudos et rôles) et les Matchs (date, adversaire, map, score, résultat).','L’invité ne voit ni statistiques, ni agents, ni compositions, ni plans de map, ni adversaires, ni préparation, ni planning, ni notes ou débriefs, ni données et mots de passe (seuls les Patch notes restent accessibles en plus). Il peut aussi lire les Patch notes, et régler son thème dans son profil.','Profil réorganisé en onglets : Profil (photo, message de l’admin, mot de passe, voir comme un joueur), Apparence (thème, couleurs, taille, police, menu), Notifs (conseils, rappels du planning, installation) et Options (page de départ, map de la semaine, réinitialisation). L’onglet choisi est retenu, et le bouton Fermer / Se déconnecter reste toujours visible.','Admin : dans « Voir le site comme un joueur », une entrée « Invité » permet de vérifier exactement ce que voit un invité.']},
 {v:'1.6.1',d:'2026-10-24',t:['Mobile simplifié : un seul accès au profil (ta photo en haut à droite) et un seul bouton d’ajout (le « ＋ » flottant). Le bouton ☰ et le « ＋ » de la barre du haut sont supprimés, ainsi que les doublons dans le menu (recherche, profil).','Mobile : la barre du bas passe à 5 boutons (Dashboard, Roster, Planning, Matchs, Plus). Le menu « Plus » devient une grille de tuiles sans descriptions, avec seulement les autres pages.','Mobile : titre de page en double retiré, bouton ↑ retiré, dashboard allégé (cartes en doublon masquées), aides « Comment ça marche ? » et réglages réservés à l’ordinateur masqués (menu latéral, largeur, icônes, tri manuel du roster, rotation des maps…). Tout reste disponible sur ordinateur. L’affichage mobile s’active tout seul sur téléphone : le réglage « Affichage mobile » et le bouton « Affichage ordinateur » sont supprimés.','Mise à jour automatique : à chaque ouverture ou rechargement du site ou de l’application (et quand tu reviens dessus après quelques minutes), les joueurs récupèrent seuls la dernière sauvegarde partagée, sans confirmation. Tes données d’avant restent récupérables avec « Annuler la dernière mise à jour ». Pour l’admin, rien n’est remplacé automatiquement, afin de ne jamais écraser tes modifications non publiées.','Admin : dans ton profil, « Voir le site comme un joueur » te connecte au compte d’un joueur choisi, sans mot de passe et en lecture seule, pour vérifier ce qu’il voit. Un bouton « Retour à mon profil » reste affiché en bas de l’écran (et dans le profil du joueur). Pendant cette vue, la mise à jour automatique est coupée pour ne pas toucher à tes données.']},
 {v:'1.6.0',d:'2026-10-24',t:['Application installable (PWA) : le site peut être hébergé en ligne (GitHub Pages) puis installé sur l’écran d’accueil d’un téléphone, avec son icône, en plein écran et avec un mode hors ligne. Les fichiers du site sont fournis dans le dossier de l’application (index.html, sw.js, manifest, icônes).','Notifications du planning : chaque joueur peut activer dans son profil des rappels la veille à 18 h et avant chaque événement (30 min, 1 h, 2 h ou aucun), même quand le site est fermé. Les rappels incluent le type, l’heure, le titre et la map de la semaine. Un appui sur la notification ouvre le planning.','Admin : nouvel onglet Données › Notifications pour saisir l’adresse du serveur et la clé publique, envoyer un test et voir les abonnés. Le serveur (worker.js, Cloudflare gratuit) lit le planning dans ton gist toutes les 5 minutes : pense à publier (⬆) après chaque modification du planning.','Profil : bloc « Application et notifications » avec le bouton d’installation (Android) ou les étapes pour iPhone, et le statut des notifications. Un conseil propose d’activer les notifications aux joueurs concernés.','Le guide d’installation complet est dans GUIDE.md.']},
 {v:'1.5.4',d:'2026-10-24',t:['Mobile : bouton flottant « ＋ » (admin) en bas à droite qui ajoute directement ce qui correspond à la page : match, joueur ou staff, événement, composition, plan, rencontre ou préparation. Le bouton ↑ passe à gauche pour ne pas le gêner.','Mobile : quand tu écris dans un champ (recherche, texte, nombre), la barre du bas et le bouton « ＋ » se masquent pour laisser la place au clavier, et reviennent ensuite.','Mobile : dans les formulaires plein écran, les boutons Enregistrer / Annuler restent collés en bas, sans avoir à défiler jusqu’à la fin.','Mobile : planning plus lisible. Chaque jour affiche des pastilles de couleur (plein = événement, anneau = match saisi) et un appui ouvre le détail du jour, avec « + Ajouter » pour l’admin, au lieu d’ouvrir directement un formulaire.','Mobile : dans Statistiques, la colonne Joueur reste visible quand tu fais défiler le tableau sur le côté (Classement, Kills / morts / assists, Utilité en matchs importants, Compteur d’aces).','Mobile : bouton ← dans la barre du haut pour revenir à la page précédente, noms de la barre du bas qui ne se coupent plus, retour visuel au toucher sur les boutons, pas de zoom accidentel sur double tap, hauteur d’écran correcte avec la barre d’adresse du navigateur.','Mobile : le site peut être ajouté à l’écran d’accueil et s’ouvre alors en plein écran, comme une application.']},
 {v:'1.5.3',d:'2026-10-24',t:['Données : l’onglet est maintenant rangé en catégories avec des sous-onglets. Général (nom du site, points de qualification), Sauvegarde (export, import, démo, réinitialisation dans une zone dangereuse), Partage (publier sur GitHub pour l’admin, mise à jour depuis le lien), et pour l’admin Mots de passe et Messages.','Données : résumé en haut de page (version, nombre de joueurs et de matchs, dernière mise à jour, dernière publication et état du jeton pour l’admin). Les onglets Mots de passe et Messages affichent un compteur : joueurs sans mot de passe, messages en attente.','Les sous-onglets restent visibles quand on fait défiler la page, et défilent sur le côté sur mobile.']},
 {v:'1.5.2',d:'2026-10-24',t:['Admin : publication en un clic. Le bouton « ⬆ Publier » (en haut de chaque page sur ordinateur, dans le menu « Plus » sur mobile, et dans Données › Publier sur GitHub) envoie tes données directement dans le gist GitHub du lien partagé, sans exporter le JSON ni le coller à la main. Les joueurs les reçoivent ensuite avec « Mettre à jour depuis le lien ».','Configuration une seule fois : dans Données › Publier sur GitHub, colle un jeton GitHub « classic » avec la seule permission « gist ». Le jeton reste uniquement sur ton appareil : il n’est ni exporté, ni partagé avec les joueurs.','Une publication réussie compte aussi comme sauvegarde (le rappel « Pense à sauvegarder » disparaît).']},
 {v:'1.5.1',d:'2026-10-24',t:['Mobile : les notifications (messages, rappels, conseils, alertes) n’apparaissent plus en haut de l’écran. Elles sont rangées dans l’onglet Vérifications, dans un bloc « Notifications » au-dessus des vérifications de données. Un compteur sur « Plus » et sur Vérifications indique combien tu en as. Chaque notification garde ses boutons et peut être fermée, ou toutes d’un coup avec « Tout effacer ».','Sur ordinateur, rien ne change : les notifications restent en haut à droite.']},
 {v:'1.5.0',d:'2026-10-24',t:['Version mobile : sur téléphone, le site passe tout seul en affichage mobile. Une barre en haut montre la page en cours avec la recherche, l’ajout (admin) et le menu. La barre du bas donne accès à Dashboard, Roster, Planning, Matchs et Statistiques, et « Plus » ouvre le menu complet : toutes les pages (Compositions, Maps, Adversaires, Préparation, Vérifications, Données, Patch notes) avec leurs compteurs, ton profil et la recherche.','Mobile : les tableaux défilent sur le côté au lieu de dépasser de l’écran, les cartes passent sur une seule colonne, les onglets défilent horizontalement, les formulaires et la recherche s’ouvrent en plein écran, et les champs ont une taille qui évite le zoom automatique du téléphone. Les boutons sont plus grands pour le doigt.','Profil : nouveau réglage « Affichage mobile » (Automatique, Toujours activé ou Désactivé). Le menu mobile propose aussi « Affichage ordinateur » pour revenir à l’affichage classique.']},
 {v:'1.4.6',d:'2026-10-24',t:['Générateur de compos : les compos « Défensive » et « Agressive » correspondent enfin à leur nom. Une compo défensive cherche 2 Sentinels, avec un Controller et des Initiators et peu ou pas de Duelist. Une compo agressive cherche 2 Duelists. Si les niveaux d’agents de ton Roster ne permettent pas d’aligner 2 Sentinels ou 2 Duelists, le site l’indique et propose les compos les plus proches.','Générateur de compos : le détail de chaque proposition dit maintenant si elle a bien 2 Sentinels (défensive) ou 2 Duelists (agressive), et le score de style d’une compo défensive baisse pour chaque Duelist.']},
 {v:'1.4.5',d:'2026-10-23',t:['Patch notes : chaque version est dépliable. Clique sur une version pour voir ses nouveautés. Seule la version actuelle est ouverte au départ ; les boutons « Tout déplier » et « Tout replier » ouvrent ou ferment tout d’un coup.','Patch notes : les versions sont rangées par série (1.4, 1.3, 1.2, 1.1, 1.0) avec un menu d’onglets, comme dans Compositions. La série de ta version est ouverte par défaut ; le chiffre à côté de chaque onglet indique combien de versions elle contient.']},
 {v:'1.4.4',d:'2026-10-23',t:['Adversaires : un adversaire nommé « 5s » est ignoré. Il n’apparaît plus dans l’onglet Adversaires et n’est plus proposé quand tu cliques sur « Importer mes matchs ».','Générateur de compos : nouveau bloc « Joueurs en game ». Clique sur les joueurs (titulaires ou remplaçants) qui jouent la partie : il en faut 5. Sans choix, ce sont les joueurs actifs du Roster, comme avant. Le bouton « Revenir aux joueurs actifs » remet tout à zéro. Le bloc est aussi dans les idées de pracs.','Remplaçants : les propositions du générateur et les idées de pracs affichent « Si un remplaçant joue ». Tu y vois l’agent que chaque remplaçant peut prendre à la place de chaque titulaire, d’après ses niveaux dans le Roster. Ces agents sont sauvegardés avec la compo.','Compositions : dans le formulaire d’une compo, choisis pour chaque remplaçant son agent et le titulaire qu’il remplace. Ils apparaissent sur la carte de la compo et dans « Copier ».','Statistiques > Classement : nouveau tableau Kills, Morts et Assists, avec le total et la moyenne par match. Clique sur Kills, Morts ou Assists pour trier. Il suit les filtres de map et de type de match.','Statistiques > Matchs importants : les tableaux « Utilité en matchs importants » et « Compteur d’aces » sont plus larges et plus hauts. Les titres de colonnes ne se coupent plus (défilement horizontal sur petit écran).','Matchs : les matchs de type Tournoi et Playoff ont un champ « Lien de la VOD ». Il apparaît dans le formulaire quand tu choisis ce type. Colle l’adresse de la VOD (YouTube, Twitch, Drive…) : elle s’affiche en bouton « ▶ VOD » dans la liste des matchs et en bouton « Regarder la VOD » dans le détail. Si tu oublies le https://, il est ajouté tout seul.','Nouvelles icônes pour les onglets Maps, Adversaires et Statistiques, dessinées dans le style du menu : elles prennent ta couleur d’accent et suivent le thème clair ou sombre.','Profil : 5 nouveaux réglages d’affichage. Fond du site (standard ou noir pur), largeur du contenu (pleine ou centrée), icônes du menu (avec ou sans fond), compteurs du menu (affichés ou masqués) et forme des photos (rondes ou carrées). Ils restent sur ton appareil et se remettent à zéro avec « Réinitialiser l’affichage ».']},
 {v:'1.4.3',d:'2026-10-23',t:['Planning : événements répétés. Dans le formulaire d’un événement, choisis « Toutes les semaines », « Toutes les 2 semaines », « Tous les mois », « Tous les jours » ou « Tous les ans », avec une date de fin optionnelle. Ils apparaissent avec ↻ dans le calendrier et dans les prochains événements. Modifier un événement répété modifie toute la série ; le supprimer ou le glisser vers un autre jour te demande si tu veux ne toucher qu’à cette date ou à toute la série.','Planning : map de la semaine (mode Premier, où la map change chaque semaine). Une barre ◎ au-dessus de chaque semaine du calendrier affiche la map. L’admin clique sur la barre pour la changer. Nouveau bouton « Rotation des maps » : tu écris les maps dans l’ordre, une par semaine, à partir de la semaine de ton choix, et elles sont toutes remplies d’un coup.','Planning : le bouton « Map de la semaine » affiche ou masque ces barres (réglage propre à ton appareil, aussi dans ton profil). La map de la semaine apparaît aussi dans le détail d’un jour et à côté des matchs, tournois et entraînements à venir.','Les maps de chaque semaine sont enregistrées dans le JSON : exporte et republie-le pour que les joueurs les reçoivent.']},
 {v:'1.4.2',d:'2026-10-23',t:['Dashboard : nouvelle icône de menu (maison) à la place du carré.','Fenêtres (profil, formulaires, aides, mots de passe, détail d’un jour du planning) : une croix ✕ en haut à droite pour fermer sans descendre tout en bas. Elle reste visible quand on fait défiler la fenêtre. Un clic à côté de la fenêtre ferme aussi le profil, les aides et le détail d’un jour du planning (pas les formulaires, pour ne rien perdre).','Navigation : bouton « ← Page précédente » en haut de chaque page, raccourcis Alt + ← / Alt + → pour passer à la page précédente / suivante du menu, et la recherche rapide a maintenant une croix.','L’aide des raccourcis (?) liste aussi Alt + ← / →.','Nouveau : conseils en notification (ampoule). Ils apparaissent au bon moment selon la page où tu es et l’état de tes données (roster incomplet, matchs sans stats, maps sans plan, match proche sans préparation, forme en baisse, qualification playoff proche, etc.), jamais plus d’un à la fois, et chacun une seule fois. Boutons : action directe, « Compris », « Ne plus afficher les conseils ». Réglage dans ton profil : Conseils activés / désactivés + « Réafficher les conseils déjà vus ». Réglage propre à ton appareil.']},
 {v:'1.4.1',d:'2026-10-23',t:['Nouveau : onglet Planning (catégorie Équipe), un calendrier mensuel. L’admin clique sur un jour pour ajouter un événement (entraînement, match, tournoi, réunion, autre), clique sur un événement pour le modifier ou le supprimer, et peut le glisser vers un autre jour. Les joueurs le consultent. Les matchs saisis apparaissent automatiquement. Une notification rappelle les événements du jour et du lendemain.','Menu : le réglage de profil propose maintenant « Petit » (condensé, par défaut) ou « Grand » (plus aéré). Le bouton en bas du menu réduit toujours le menu en icônes seules, réglage conservé par compte.','Préparation revient dans la catégorie Analyse. Catégories : Équipe (Dashboard, Roster, Planning), Jeu (Compositions, Maps, Matchs), Analyse (Statistiques, Adversaires, Préparation), Outils.','Dashboard : la roue de stats est beaucoup plus compacte (roue réduite et valeurs à côté) pour ne plus agrandir toute la rangée de cartes.']},
 {v:'1.4.0',d:'2026-10-23',t:['Menu refait : 4 catégories. Équipe (Dashboard, Roster, Préparation), Jeu (Compositions, Maps, Matchs), Analyse (Statistiques, Adversaires), Outils (Vérifications, Données, Patch notes). Les touches 1 à 0 suivent le nouvel ordre.','Préparation (planning avant match) déplacée dans la catégorie Équipe, juste sous Roster.','Profil : nouveau réglage « Menu latéral » (Grand avec les noms, ou Petit avec les icônes). Il est propre à ton compte sur cet appareil ; le bouton en bas du menu reste disponible.','Roster refait : trois onglets Joueurs / Remplaçants / Staff avec leurs compteurs, comme dans Compositions. Les boutons ↑ ↓ réordonnent à l’intérieur d’un onglet.','Dashboard : nouvelle carte « Roue de stats » (K/D, KDA, ADR, KAST, HS%, Régularité) pour le joueur connecté, comparée à la moyenne de l’équipe. L’admin peut choisir n’importe quel joueur.']},
 {v:'1.3.5',d:'2026-10-23',t:['Roster : les agents préférés s’affichent sur 3 colonnes (3 sur la première ligne, 2 + « autres » sur la seconde) pour gagner de la place sur les cartes.','Menu : navigation condensée (espacements, icônes et en-têtes réduits) pour tenir à l’écran sans barre de défilement sur un écran standard.']},
 {v:'1.3.4',d:'2026-10-23',t:['Profil : 28 couleurs au choix pour le contour de la photo (au lieu de 8), aussi dans la fiche joueur.','Profil : le menu est beaucoup plus fluide. Les réglages s’appliquent sans recharger tout le site à chaque clic, la couleur personnalisée ne fige plus, et le flou d’arrière-plan des fenêtres est supprimé.','Nouveau : notifications en haut à droite. Ralentissement détecté (propose de désactiver les animations), bug (prévenir l’administrateur), rappel de mettre à jour les données régulièrement, hors ligne / connexion rétablie, rappel de sauvegarde pour l’admin, erreur de stockage.','Nouveau : message perso. L’admin écrit un mot pour chaque joueur dans Données ; le joueur le voit en notification après connexion ou mise à jour, et le retrouve dans son profil. Penser à exporter le JSON et à le republier.','Correctif : le bouton Afficher / Masquer les mots de passe de l’admin (Données) fonctionne de nouveau (conflit introduit en 1.3.3 avec l’œil du changement de mot de passe).']},
 {v:'1.3.3',d:'2026-10-23',t:['Maps : ajout de Breeze au pool de maps (ajoutée automatiquement aux données déjà existantes).','Maps : suppression du menu déroulant de sélection en haut de l’onglet ; il suffit de cliquer sur la carte colorée de la map pour l’ouvrir.','Changement de mot de passe : petit œil à côté de chaque champ (mot de passe actuel, nouveau, confirmation) pour afficher ou masquer ce qui est saisi.','Mise à jour partagée : petit tutoriel dans l’onglet Données (d’abord Enregistrer le lien, puis Mettre à jour depuis le lien ; le lien est prédéfini).']},
 {v:'1.3.2',d:'2026-10-23',t:['Dashboard : nouvelle carte « Conseils pour toi » dans la case vide, avec les conseils du site pour le joueur connecté (à partir de 3 matchs avec stats).','Comptes : chaque joueur a un mot de passe aléatoire, généré quand l’admin se connecte (et pour tout nouveau joueur). Le mot de passe est toujours demandé : cliquer sur un pseudo ne suffit plus, et un compte sans mot de passe ne peut pas se connecter. Les sessions ouvertes avant cette version sont fermées.','Mots de passe : l’admin les retrouve dans Données (affichage, copie, réinitialisation), sur son appareil. Les joueurs peuvent le changer depuis leur profil (valable sur leur appareil). Seules des empreintes salées sont exportées, jamais les mots de passe en clair. Après une génération, exporter le JSON et le republier sur le lien partagé.','Mise à jour partagée : bouton d’import de la sauvegarde partagée sur l’écran de connexion (lien préconfiguré), rechargement sans cache GitHub, et un stockage navigateur plein ne bloque plus la mise à jour.','Logo : l’icône de l’onglet du navigateur est remplacée par un logo (losange rouge).','Personnalisation : nouveaux réglages dans le profil (couleur d’accent du site, taille du texte, densité des cartes, police, coins arrondis, animations réduites, page affichée à la connexion) et bouton pour réinitialiser l’affichage. Ils restent sur l’appareil de chaque utilisateur.']},
 {v:'1.3.1',d:'2026-10-23',t:['Préparation : le Comparateur est intégré à cet onglet (deux onglets : Préparations et Comparateur). L’entrée du menu disparaît, les anciens liens redirigent automatiquement.','Maps : résumé du pool (meilleure map, à travailler, sans plan, jamais jouées), tri du pool, alerte « aucun plan », barres de victoires (attaque, défense, matchs importants), filtres des plans par côté avec compteurs, bouton + Plan sur la map ouverte.','Roster : résumé de l’équipe active (K/D moyen, tendances de forme, remplaçants), K/D de chaque actif, filtre actifs / remplaçants avec compteurs, tris Forme récente et Rôle, tendance de forme en vue compacte, compteur de résultats et bouton Réinitialiser.','Dashboard : suppression du bloc et de l’indicateur Compositions sauvegardées (les compos restent dans l’onglet Compositions).']},
 {v:'1.3.0',d:'2026-10-23',t:['Nouveau : comptes. Chaque joueur se connecte avec son pseudo du roster, sans mot de passe. Le compte admin est protégé par un mot de passe.','Nouveau : profil personnel (clic sur ton nom en haut du menu) avec photo de profil, couleur de la photo et thème clair ou sombre. Ces réglages restent uniquement sur ton appareil : ils ne sont ni exportés ni partagés.','Nouveau : thème clair.','Droits : l’admin peut tout modifier. Les joueurs consultent toutes les données, mettent à jour depuis le lien partagé et personnalisent leur affichage ; les modifications des données sont réservées à l’admin.','Maps : vue d’ensemble de toutes les maps (bilan, point fort ou à travailler, plans et compos), détail de la map choisie (départ attaque et défense, matchs importants, derniers résultats, équipes affrontées), compos avec leurs résultats mesurés, filtres sur les plans et bouton Dupliquer.','Roster : résumé de l’équipe active avec alertes sur les rôles, filtres par rôle et par statut, tris (nom, K/D, régularité), vue compacte, bouton Actif / Remplaçant, repère « Toi » sur ta fiche.']},
 {v:'1.2.0',d:'2026-10-23',t:['Nouvel onglet Adversaires : un carnet des équipes déjà affrontées (practice, tournoi, playoff, compétition) avec, pour chaque rencontre, la map, le score, votre compo et la leur, modifiables à la main. Bouton pour importer les matchs déjà saisis.','Préparation : explication de l’onglet, barre de progression de la checklist, historique complet contre l’équipe (matchs + carnet), liens avec la fiche adversaire, bouton pour tout décocher.','Comparateur : explication de l’onglet, description visible de chaque ligne, composition joueur par joueur dans l’en-tête, valeur la plus élevée mise en évidence (▲) et bloc Lecture rapide.','Navigation : l’onglet Adversaires est dans le groupe Avant-match (les touches 1 à 0 suivent le nouvel ordre), la recherche rapide trouve aussi les équipes, aide des raccourcis avec la touche ?, aides Comment ça marche masquables, les champs de recherche gardent le focus pendant la frappe.']},
 {v:'1.1.0',d:'2026-10-23',t:['Nouveau : mise à jour partagée depuis un lien (GitHub ou Google Drive), avec sauvegarde automatique avant remplacement et bouton pour annuler.','Nouveau : si tu charges une sauvegarde issue d’une version plus récente du site, une notification t’avertit qu’une nouvelle version est disponible. Ta sauvegarde est chargée quand même.','Nouveau : onglet Patch notes.','Les exports JSON contiennent maintenant le numéro de version du site.']},

const vcmp=(a,b)=>{const x=String(a||'0').split('.').map(Number),y=String(b||'0').split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};

const ADMIN_NAME='MijeMije',ADMIN_HASH='79f61ee3b3bbf9a8978b435c911f9fd926c252d23b0bac191729fb5ad12edde7';
const sha256=m=>{const K=[],H=[];for(let c=0,n=2;c<64;n++){let q=1;for(let d=2;d*d<=n;d++)if(n%d==0){q=0;break}if(q){if(c<8)H[c]=Math.floor((Math.sqrt(n)%1)*4294967296);K[c]=Math.floor((Math.cbrt(n)%1)*4294967296);c++}}
 const b=new TextEncoder().encode(m),l=b.length,n=((l+9+63)>>6)<<6,a=new Uint8Array(n);a.set(b);a[l]=128;const dv=new DataView(a.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 const w=new Uint32Array(64),h=H.slice(),rr=(x,c)=>(x>>>c)|(x<<(32-c));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let[A,B,C,D,E,F,G,Hh]=h;for(let i=0;i<64;i++){const S1=rr(E,6)^rr(E,11)^rr(E,25),ch=(E&F)^(~E&G),t1=(Hh+S1+ch+K[i]+w[i])>>>0,S0=rr(A,2)^rr(A,13)^rr(A,22),mj=(A&B)^(A&C)^(B&C),t2=(S0+mj)>>>0;Hh=G;G=F;F=E;E=(D+t1)>>>0;D=C;C=B;B=A;A=(t1+t2)>>>0}
  [A,B,C,D,E,F,G,Hh].forEach((v,i)=>h[i]=(h[i]+v)>>>0)}
 return h.map(x=>x.toString(16).padStart(8,'0')).join('')};

const pwGen=()=>{const a=new Uint32Array(10);crypto.getRandomValues(a);return[...a].map(x=>PWA[x%PWA.length]).join('')};
const pwHash=(pw,s)=>{s=s||[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('');return{s,h:sha256('teamops|pl|'+s+'|'+pw)}};
const pwVault=()=>{try{return JSON.parse(localStorage[PVK]||'{}')}catch(e){return{}}};
const pwVSave=v=>{try{localStorage[PVK]=JSON.stringify(v)}catch(e){}};
const pwVis=p=>{const pw=pwVault()[p.id];return p.pw&&pw&&pwHash(pw,p.pw.s).h===p.pw.h?pw:null};
const pwEff=q=>{const o=getProf(q.name).pw;return o&&o.b===(q.pw?q.pw.h:'')?o:(q.pw||null)};

 if(ac){st.setProperty('--rr',[1,3,5].map(i=>parseInt(ac.slice(i,i+2),16)).join(','));st.setProperty('--r',ac);st.setProperty('--r2','#'+ac.slice(1).match(/../g).map(x=>Math.round(parseInt(x,16)*.78).toString(16).padStart(2,'0')).join(''))}else{st.removeProperty('--r');st.removeProperty('--rr');st.removeProperty('--r2')}
 FF[P.font]?st.setProperty('--f',FF[P.font]):st.removeProperty('--f');(document.body||h).style.zoom={s:'.9',l:'1.12'}[P.size]||'';
 h.setAttribute('data-dens',P.dens=='c'?'compact':'');h.setAttribute('data-anim',P.anim=='off'?'off':'');h.setAttribute('data-sq',P.sq=='round'?'round':'');['bg','wid','ico','bdg','avs'].forEach(k=>h.setAttribute('data-'+k,P[k]||''));if(document.body){document.body.classList.toggle('navcol',P.col=='1');document.body.classList.toggle('menu-lg',P.menu=='lg');document.body.classList.toggle('mob',isMob())}};

 x.onclick=close;

 box.appendChild(e);

const masWil=(v,n)=>{if(!n)return null;const z=1.645,p=v/n,d=1+z*z/n,c=p+z*z/(2*n),q=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));return{lo:Math.round(100*(c-q)/d),hi:Math.round(100*(c+q)/d)}};

const masRank=L=>{const W={alert:100,tip:40,ok:15},seen={};return L.filter(m=>!seen[m.id]&&(seen[m.id]=1)).map((m,i)=>({m,k:(W[m.lvl]||40)+(m.u||0)-i*.01})).sort((a,b)=>b.k-a.k).map(x=>x.m)};

 const rec=S.matches.filter(m=>m.date).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))),pl=rec.filter(m=>m.res=='V'||m.res=='D'),c={rec,pl,n:S.matches.length};

 const G={};rec.forEach(m=>(m.stats||[]).forEach(x=>{if(!x.n||x.k==null||x.k===''||x.d==null||x.d==='')return;(G[norm(x.n)]=G[norm(x.n)]||{n:x.n,r:[]}).r.push({k:+x.k||0,d:+x.d||0})}));

 c.trend=Object.values(G).filter(g=>g.r.length>=5).map(g=>{const a=kd(g.r.slice(-3)),b=kd(g.r.slice(0,-3));return{n:g.n,cnt:g.r.length,a,b,dl:a!=null&&b!=null?a-b:null}}).filter(t=>t.dl!=null);

}
if(!out.length)add('calm','tip','Rien d’urgent côté préparation. Continuons à enregistrer matchs, plans et planning pour que mes conseils restent utiles.',['dash'],null);

 else{const g=MGD2.find(x=>x[0]==MGR),k=g[0],P=R.filter(x=>x[k]!=null).sort((a,b)=>g[2]?b[k]-a[k]:a[k]-b[k]);
  tbl=P.length?`<div class="c" style="overflow-x:auto"><table><tr><th>#</th><th>Joueur</th><th>Record</th></tr>${P.map((x,i)=>`<tr><td>${med(i)}</td><td>${av(x.n,22)} ${esc(x.n)}${me&&norm(x.n)==norm(me.name)?' <span class="tag">toi</span>':''}</td><td><b>${g[3](x[k])}</b></td></tr>`).join('')}</table></div>`:'<div class="c m">Personne n’a encore de record à ce jeu.</div>'}
