/* ===== MOTS DE PASSE JOUEURS : seuls des hash salés sont stockés dans les données (p.pw). Le clair généré reste sur l'appareil de l'admin. ===== */
const PWA='abcdefghjkmnpqrstuvwxyz23456789',PVK='teamops_pwv';
const pwGen=()=>{const a=new Uint32Array(10);crypto.getRandomValues(a);return[...a].map(x=>PWA[x%PWA.length]).join('')};
const pwHash=(pw,s)=>{s=s||[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('');return{s,h:sha256('teamops|pl|'+s+'|'+pw)}};
const pwVault=()=>{try{return JSON.parse(localStorage[PVK]||'{}')}catch(e){return{}}};
const pwVSave=v=>{try{localStorage[PVK]=JSON.stringify(v)}catch(e){}};
const pwVis=p=>{const pw=pwVault()[p.id];return p.pw&&pw&&pwHash(pw,p.pw.s).h===p.pw.h?pw:null};
const pwEff=q=>{const o=getProf(q.name).pw;return o&&o.b===(q.pw?q.pw.h:'')?o:(q.pw||null)};
const pwOk=(q,pw)=>{const h=pwEff(q);return !h||sha256('teamops|pl|'+h.s+'|'+pw)===h.h};
const pwPanel=()=>{const P=S.players.filter(p=>!p.demo);return`<h3 style="margin-top:22px">Mots de passe des joueurs</h3><div class="c"><div class="m" style="margin-bottom:10px;line-height:1.6">Chaque joueur se connecte avec son pseudo et son mot de passe. Les mots de passe en clair ne sont affichés que sur cet appareil : l’export JSON ne contient que des empreintes (hash). Après une génération ou une réinitialisation, <b>exporte le JSON et republie-le</b> sur ton lien partagé. Un joueur peut changer son mot de passe depuis son profil, mais ce changement reste sur son appareil.</div>${P.length?`<table><tr><th>Joueur</th><th>Mot de passe</th><th></th></tr>${P.map(p=>`<tr><td>${av(p,22)} ${esc(p.name)}</td><td style="font-family:monospace">${!p.pw?'<span class="m">aucun</span>':pwVis(p)?(PWV?esc(pwVis(p)):'••••••••••'):'<span class="m">défini (non visible sur cet appareil)</span>'}</td><td><button onclick="A.pwCp('${p.id}')">Copier</button> <button onclick="A.pwReset('${p.id}')">Réinitialiser</button></td></tr>`).join('')}</table>`:'<div class="m">Aucun joueur.</div>'}<div class="row" style="margin-top:10px"><button onclick="A.pwTog()">${PWV?'Masquer':'Afficher'} les mots de passe</button><button onclick="A.pwList()">Copier la liste</button><button onclick="A.pwAll()">Générer les manquants</button></div></div>`};

 if(ac){st.setProperty('--rr',[1,3,5].map(i=>parseInt(ac.slice(i,i+2),16)).join(','));st.setProperty('--r',ac);st.setProperty('--r2','#'+ac.slice(1).match(/../g).map(x=>Math.round(parseInt(x,16)*.78).toString(16).padStart(2,'0')).join(''))}else{st.removeProperty('--r');st.removeProperty('--rr');st.removeProperty('--r2')}
 FF[P.font]?st.setProperty('--f',FF[P.font]):st.removeProperty('--f');(document.body||h).style.zoom={s:'.9',l:'1.12'}[P.size]||'';
 h.setAttribute('data-dens',P.dens=='c'?'compact':'');h.setAttribute('data-anim',P.anim=='off'?'off':P.anim=='light'?'light':'');h.setAttribute('data-sq',P.sq=='round'?'round':'');['bg','wid','ico','bdg','avs'].forEach(k=>h.setAttribute('data-'+k,P[k]||''));if(document.body){document.body.classList.toggle('navcol',P.col=='1');document.body.classList.toggle('menu-lg',P.menu=='lg');document.body.classList.toggle('mob',isMob())}};

/* Quota : 2 tournois maximum par semaine (lundi à dimanche). Planning (type Tournoi) + matchs saisis de type Tournoi, un même jour n'est compté qu'une fois. */
const TQ=2;
const tqWeek=k=>{const d=pd(k),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return ymd(d)};
function tqList(){const a=ymd(new Date(Date.now()-21*864e5)),b=ymd(new Date(Date.now()+150*864e5)),per={},sm={};
 plX(a,b).filter(e=>e.type=='Tournoi').forEach(e=>{per[e.date]=(per[e.date]||0)+1});
 S.matches.filter(m=>m.date&&mty(m)=='Tournoi'&&m.date>=a&&m.date<=b).forEach(m=>{sm[m.date]=(sm[m.date]||0)+1});
 Object.keys(sm).forEach(d=>{per[d]=Math.max(per[d]||0,sm[d])});
 const W={};Object.keys(per).sort().forEach(d=>{const o=W[tqWeek(d)]||(W[tqWeek(d)]={n:0,dates:[],over:[]});for(let i=0;i<per[d];i++){if(o.n<TQ){if(!o.dates.includes(d))o.dates.push(d)}else if(!o.over.includes(d))o.over.push(d);o.n++}});return W}
const tqOver=(d,W)=>{const o=(W||tqList())[tqWeek(d)];return !!o&&o.over.includes(d)&&!o.dates.includes(d)};
const tqKeep=L=>{const W=tqList();return L.filter(e=>!(e.type=='Tournoi'&&tqOver(e.date,W)))};
const masRel=k=>{const n=masDays(k);return n==0?'aujourd’hui':n==1?'demain':n<7?'dans '+n+' jours ('+plLong(k)+')':'le '+plLong(k)};

/* --- Aim Lab --- */

MGG.aim=()=>{AIM.run=0;AIM.tg=null;mgB(`<div class="mg-hud"><span>Temps<b id="ma-t">30</b></span><span>Points<b id="ma-s">0</b></span><span>Précision<b id="ma-a">–</b></span></div><div id="ma-ar" class="mg-arena" onpointerdown="AIM.dn(event)"><div class="mg-ov" id="ma-ov"><div class="m" style="line-height:1.6">Touche les cibles avant qu’elles ne disparaissent. Un tir à côté coûte 3 points.</div><div class="mg-rec">${mgRecTxt('aim')}</div><button type="button" class="p" onclick="AIM.go()">Commencer</button></div></div>`)};
AIM.go=()=>{Object.assign(AIM,{run:1,hits:0,shots:0,pts:0,end:Date.now()+30000,life:1300});const ov=$('ma-ov');if(ov)ov.remove();AIM.upd();AIM.spawn();mgI(()=>{const e=$('ma-t');if(e)e.textContent=Math.max(0,Math.ceil((AIM.end-Date.now())/1000));if(Date.now()>=AIM.end)AIM.fin()},100)};
AIM.spawn=()=>{if(!AIM.run)return;const ar=$('ma-ar');if(!ar)return;if(AIM.tg)AIM.tg.remove();const sz=ar.clientWidth<420?60:66,t=document.createElement('div');t.className='mg-tg';t.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.round(Math.random()*(ar.clientWidth-sz))}px;top:${Math.round(Math.random()*(ar.clientHeight-sz))}px;animation-duration:${AIM.life}ms`;t.dataset.t=Date.now();ar.appendChild(t);AIM.tg=t;clearTimeout(AIM.tt);AIM.tt=mgT(()=>{if(AIM.tg===t){t.remove();AIM.tg=null;AIM.spawn()}},AIM.life)};
AIM.dn=ev=>{if(!AIM.run)return;const t=ev.target.closest&&ev.target.closest('.mg-tg');AIM.shots++;if(t&&t===AIM.tg){const el=Date.now()-(+t.dataset.t);AIM.hits++;AIM.pts+=10+Math.max(0,Math.round((1-el/AIM.life)*5));t.remove();AIM.tg=null;clearTimeout(AIM.tt);AIM.life=Math.max(650,1300-AIM.hits*18);AIM.spawn()}else AIM.pts=Math.max(0,AIM.pts-3);AIM.upd()};
AIM.upd=()=>{const s=$('ma-s'),a=$('ma-a');if(s)s.textContent=AIM.pts;if(a)a.textContent=AIM.shots?Math.round(AIM.hits/AIM.shots*100)+'%':'–'};
AIM.fin=()=>{if(!AIM.run)return;AIM.run=0;mgClear();const nb=mgRec('aim',AIM.pts),acc=AIM.shots?Math.round(AIM.hits/AIM.shots*100):0;mgB(mgEnd('Terminé !',[[AIM.pts,'points'],[AIM.hits,'cibles'],[acc+'%','précision']],nb,'aim'))};

RX.tap=()=>{const st=RX.st;if(st=='idle'||st=='res'||st=='early'){if(RX.n>=5)return;RX.set('wait','Attends…','Ne touche pas encore.');RX.to=mgT(()=>{RX.t0=performance.now();RX.set('go','Maintenant !','')},1500+mgRnd(2500))}else if(st=='wait'){clearTimeout(RX.to);RX.set('early','Trop tôt !','Touche pour réessayer.')}else if(st=='go'){const ms=Math.round(performance.now()-RX.t0);RX.t.push(ms);RX.n++;RX.upd();if(RX.n>=5)RX.fin();else RX.set('res',ms+' ms','Touche pour l’essai suivant.')}};

const AGI={};let AGIp=null;const AGW={};const agiWarm=()=>{Object.values(AGI).forEach(u=>{if(AGW[u])return;const i=new Image();i.decoding='async';i.src=u;AGW[u]=i})};

 mgB(`<div class="mg-hud"><span>Coups<b id="mm-m">0</b></span><span>Temps<b id="mm-t">0 s</b></span><span>Paires<b id="mm-p">0</b></span></div><div class="mg-mem">${MEM.c.map(c=>{const r=AG[c.n][0],col=RC[r];return`<button type="button" class="mg-card" id="mc${c.i}" onclick="MEM.flip(${c.i})"><span class="mg-bk">?</span><span class="mg-fr" style="border:2px solid ${col};background:${col}26">${agiImg(c.n)}<b>${esc(c.n)}</b><i style="color:${col}">${RN[r]}</i></span></button>`}).join('')}</div><div class="mg-rec" style="margin-top:10px">${mgRecTxt('mem')}</div>`)};
MEM.flip=i=>{const c=MEM.c[i];if(!c||MEM.lock||c.up||c.ok)return;if(!MEM.t0){MEM.t0=Date.now();mgI(()=>{const e=$('mm-t');if(e)e.textContent=Math.round((Date.now()-MEM.t0)/1000)+' s'},500)}
 c.up=1;MEM.sel.push(c);MEM.paint(c);
 if(MEM.sel.length==2){MEM.mv++;const[a,b]=MEM.sel;MEM.sel=[];
  if(a.n==b.n){a.ok=b.ok=1;MEM.done++;MEM.paint(a);MEM.paint(b);MEM.upd();if(MEM.done==8)mgT(MEM.fin,500)}
  else{MEM.upd();MEM.lock=1;mgT(()=>{a.up=b.up=0;MEM.paint(a);MEM.paint(b);MEM.lock=0},750)}}};
MEM.fin=()=>{mgClear();const sec=Math.round((Date.now()-MEM.t0)/1000),nb=mgRec('mem',MEM.mv,1);mgB(mgEnd('Bravo !',[[MEM.mv,'coups'],[sec+' s','temps'],['8 / 8','paires']],nb,'mem'))};

/* --- Quiz agents et maps (rôles tirés des données du site, une question sur les matchs de l'équipe si possible) --- */
const QZ={q:[],i:0,s:0,lock:0};
const mgQs=()=>{const names=mgShuf(Object.keys(AG)),roles=Object.keys(RN),Q=[],real=S.matches.filter(m=>!m.demo&&m.map);let k=0;
 if(real.length>=3){const cnt={};real.forEach(m=>cnt[m.map]=(cnt[m.map]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(top.length==1||top[0][1]>top[1][1]){const pool=(S.maps.length>=4?S.maps:MAPS).filter(x=>x!=top[0][0]);Q.push({t:'Sur quelle map l’équipe a-t-elle le plus de matchs enregistrés ?',o:mgShuf([top[0][0],...mgShuf(pool).slice(0,3)]),a:top[0][0]})}}
 while(Q.length<10&&k<names.length){const n=names[k++],r=AG[n][0];
  if(k%2)Q.push({t:`Quel est le rôle de ${n} ?`,o:mgShuf(roles.map(x=>RN[x])),a:RN[r]});
  else Q.push({t:`Lequel de ces agents est un ${RN[r]} ?`,o:mgShuf([n,...mgShuf(names.filter(x=>AG[x][0]!=r)).slice(0,3)]),a:n})}
 return mgShuf(Q).slice(0,10)};
MGG.quiz=()=>{QZ.q=mgQs();QZ.i=0;QZ.s=0;QZ.show()};

QZ.pick=j=>{if(QZ.lock)return;QZ.lock=1;const q=QZ.q[QZ.i],ok=q.o[j]==q.a;if(ok)QZ.s++;q.o.forEach((o,x)=>{const e=$('qo'+x);if(e)e.classList.add(o==q.a?'good':(x==j?'bad':'dim'))});mgT(()=>{QZ.i++;if(QZ.i>=QZ.q.length)QZ.fin();else QZ.show()},ok?900:1500)};
QZ.fin=()=>{const n=QZ.q.length,nb=mgRec('quiz',QZ.s);mgB(mgEnd(QZ.s>=9?'Expert !':QZ.s>=6?'Bien joué !':'Tu peux t’entraîner',[[QZ.s+' / '+n,'bonnes réponses']],nb,'quiz'))};

const mgSeed=t=>{let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h};

 mgB(`<div class="mg-day"><div class="m" style="text-transform:capitalize">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="mg-dl"><span>Map du jour</span><b>${esc(map)}</b></div><div class="mg-dl"><span>Défi d’équipe · ${ch[1]}</span><b>${esc(ch[0])}</b></div><div class="mg-dl"><span>Ton agent du jour</span>${AGI[me]?`<img src="${esc(AGI[me])}" alt="" style="width:72px;height:72px;object-fit:contain;justify-self:start">`:''}<b style="color:${rc}">${esc(me)}</b><small>${RN[AG[me][0]]}</small></div>${done?'<div class="mg-nb" style="justify-self:start">Défi relevé aujourd’hui</div>':'<button type="button" class="p" onclick="A.mgDone()">On l’a fait !</button>'}<div class="m">Défis relevés : ${dd.length}</div></div>`)};

/* --- Classement des mini-jeux : les meilleurs records de chacun sont partagés dans le gist de la Gaming House (scores) --- */
const MGD2=[['aim','Aim Lab',1,v=>v+' pts'],['rx','Réflexes',0,v=>v+' ms'],['mem','Mémoire',0,v=>v+' coups'],['quiz','Quiz',1,v=>v+' / 10']];
let MGR='all';
const mgBetter=(k,a,b)=>{const hi=MGD2.find(g=>g[0]==k)[2];return b==null||(hi?a>b:a<b)};
async function mgPush(){const me=ghhMe();if(!me||!lsg(GHT)||!ghhId()||(USER&&USER.as))return false;const o=mgLoad();if(!MGD2.some(g=>o[g[0]]!=null))return false;
 const ts=Date.now();try{await ghhMut(c=>{c.scores=c.scores||{};const old=c.scores[me.id]||{},r={n:me.name,ts};MGD2.forEach(([k])=>{const a=o[k],b=old[k];if(a!=null&&mgBetter(k,a,b))r[k]=a;else if(b!=null)r[k]=b});c.scores[me.id]=r},c=>c.scores&&c.scores[me.id]&&c.scores[me.id].ts==ts);if(S.view=='house')render(1);return true}catch(e){return false}}
A.mgSync=async()=>{if(!lsg(GHT))return toast('Ajoute ton jeton dans l’onglet Pronostics');toast('Envoi…');toast(await mgPush()?'Records envoyés au classement':'Envoi impossible pour le moment')};

 if(me){const m=S0[me.id]={n:me.name,...(S0[me.id]||{})};MGD2.forEach(([k])=>{if(loc[k]!=null&&mgBetter(k,loc[k],m[k]))m[k]=loc[k]})}
 return Object.values(S0).filter(x=>MGD2.some(g=>x[g[0]]!=null)).map(x=>({...x}))}
function mgBoard(){
 const tok=lsg(GHT),me=ghhMe();
 if(ghhId()&&ghhStale()&&!GHH.busy)setTimeout(()=>A.ghhRefresh(),0);
 if(ghhId()&&tok&&GHH.d&&!window.MGS){window.MGS=1;setTimeout(()=>{const r=(GHH.d.scores||{})[me&&me.id],o=mgLoad();if(me&&MGD2.some(([k])=>o[k]!=null&&(!r||mgBetter(k,o[k],r[k]))))mgPush()},500)}
 const R=mgRows(),pills=[['all','Général'],...MGD2.map(g=>[g[0],g[1]])],med=i=>i==0?'🥇':i==1?'🥈':i==2?'🥉':i+1;
 let tbl;
 if(!R.length)tbl='<div class="c m">Aucun record pour le moment. Joue à un mini-jeu : ton meilleur score apparaît ici, avec ceux de tes coéquipiers.</div>';
 else if(MGR=='all'){
  MGD2.forEach(([k,,hi])=>{const P=R.filter(x=>x[k]!=null).sort((a,b)=>hi?b[k]-a[k]:a[k]-b[k]);P.forEach((x,i)=>{x._p=(x._p||0)+(P.length-i);x['_r'+k]=i})});
  R.forEach(x=>{x._p=x._p||0;x._n=MGD2.filter(g=>x[g[0]]!=null).length});R.sort((a,b)=>b._p-a._p||b._n-a._n||String(a.n).localeCompare(String(b.n)));
  tbl=`<div class="c" style="overflow-x:auto"><table><tr><th>#</th><th>Joueur</th>${MGD2.map(g=>`<th>${g[1]}</th>`).join('')}<th>Points</th></tr>${R.map((x,i)=>`<tr><td>${med(i)}</td><td>${av(x.n,22)} ${esc(x.n)}${me&&norm(x.n)==norm(me.name)?' <span class="tag">toi</span>':''}</td>${MGD2.map(([k,,,f])=>`<td${x['_r'+k]===0?' style="font-weight:700;color:var(--ok)"':''}>${x[k]!=null?f(x[k]):'—'}</td>`).join('')}<td><b>${x._p}</b></td></tr>`).join('')}</table></div><div class="m" style="margin-top:6px;line-height:1.5">Points : dans chaque jeu, le meilleur marque autant de points qu’il y a de joueurs classés, le suivant un de moins, etc. Le total départage le classement général.</div>`}
 else{const g=MGD2.find(x=>x[0]==MGR),k=g[0],P=R.filter(x=>x[k]!=null).sort((a,b)=>g[2]?b[k]-a[k]:a[k]-b[k]);
  tbl=P.length?`<div class="c" style="overflow-x:auto"><table><tr><th>#</th><th>Joueur</th><th>Record</th></tr>${P.map((x,i)=>`<tr><td>${med(i)}</td><td>${av(x.n,22)} ${esc(x.n)}${me&&norm(x.n)==norm(me.name)?' <span class="tag">toi</span>':''}</td><td><b>${g[3](x[k])}</b></td></tr>`).join('')}</table></div>`:'<div class="c m">Personne n’a encore de record à ce jeu.</div>'}
 return`<h3 style="margin-top:22px">Classement des mini-jeux</h3><div class="gx-pills">${pills.map(([k,l])=>`<button class="${MGR==k?'on':''}" onclick="A.mgr('${k}')">${l}</button>`).join('')}</div>${tbl}
 <div class="row" style="margin:10px 0 0">${tok&&ghhId()?'<button onclick="A.mgSync()">Envoyer mes records</button><span class="m">Tes records sont envoyés tout seuls quand tu en bats un.</span>':'<span class="m">Pour apparaître dans le classement des autres, ajoute ton jeton dans l’onglet Pronostics (Réglages de connexion).</span>'}</div>`}
V.house=function(){
 if(!USER||isGuest())return'<h2>La Gaming House</h2><div class="c m">Cet espace est réservé aux membres connectés.</div>';
 lvStart();
 const me=ghhMe(),op=ghhG().filter(ghhOpen),todo=me?op.filter(g=>!ghhPreds(g.id).some(x=>x.p==me.id)).length:op.length,
  T=[['salon','Salon en direct','','◉'],['pron','Pronostics',todo,'◈'],['jeux','Mini-jeux','','▶'],['casino','Casino','','🎰'],['mas','Centre du staff','','✦']];
 if(!T.some(x=>x[0]==HT))HT='salon';

window.heatHTML=()=>{const C={},Mx=new Set(),Ag=new Set();S.matches.forEach(m=>(m.stats||[]).forEach(x=>{if(!x.ag||x.k==null)return;const k=x.ag+'|'+m.map;(C[k]=C[k]||[]).push(kdOf(x));Mx.add(m.map);Ag.add(x.ag)}));const M=[...Mx].sort(),A=[...Ag].sort();if(!M.length)return'<div class="c m" style="margin-top:18px">Carte thermique : renseigne les agents et les stats des matchs pour la voir apparaître.</div>';const mean=L=>L.reduce((a,v)=>a+v,0)/L.length;return`<details class="c" style="margin-top:18px"><summary><h3>Carte thermique · K/D par agent et par map</h3></summary><div style="overflow-x:auto"><table><thead><tr><th>Agent</th>${M.map(m=>`<th>${esc(m)}</th>`).join('')}</tr></thead><tbody>${A.map(g=>`<tr><td>${esc(g)}</td>${M.map(m=>{const L=C[g+'|'+m],v=L?mean(L):null;return`<td style="background:${col(v)};text-align:center" title="${L?L.length:0} partie(s)">${v==null?'·':f2(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="m">K/D moyen de l’équipe. Vert = très bon, rouge = difficile, · = jamais joué.</div></details>`};
window.heatPlHTML=()=>{const M=S.maps.filter(m=>S.matches.some(x=>x.map==m&&(x.stats||[]).length)),P=S.players.filter(p=>ser(p.name).length);if(!M.length||!P.length)return'<div class="c m" style="margin-top:18px">Carte thermique des joueurs : saisis des stats de match pour la voir apparaître.</div>';return`<details class="c" style="margin-top:18px"><summary><h3>Carte thermique · K/D de chaque joueur par map</h3></summary><div style="overflow-x:auto"><table><thead><tr><th>Joueur</th>${M.map(m=>`<th>${esc(m)}</th>`).join('')}</tr></thead><tbody>${P.map(p=>`<tr><td>${lk('p',p.name)}</td>${M.map(m=>{const L=ser(p.name,m),v=avg(L);return`<td style="background:${col(v)};text-align:center" title="${L.length} match(s)">${v==null?'·':f2(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="m">Vert = très bon K/D, rouge = difficile, · = jamais joué. Clique un nom pour sa fiche.</div></details>`};
window.fT=()=>dlgF(bc(home,'Carte thermique')+heatPlHTML()+heatHTML()+`<div class="row">${lst('LP','Joueurs')} · ${lst('LM','Maps')} · ${lst('LO','Adversaires')}</div>`);
window.barsHTML=()=>{const R=S.maps.map(m=>{const L=S.players.flatMap(p=>ser(p.name,m));return[m,avg(L),L.length]}).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);if(!R.length)return'';const mx=Math.max(...R.map(x=>x[1]),1.2);return`<details class="c" style="margin-top:18px"><summary><h3>K/D moyen de l’équipe par map</h3></summary>${R.map(([m,v,n])=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span style="width:90px">${lk('m',m)}</span><div style="flex:1;background:var(--p2);border-radius:4px"><div style="width:${Math.round(v/mx*100)}%;background:${col(v)};height:14px;border-radius:4px"></div></div><b>${f2(v)}</b><span class="m">(${n})</span></div>`).join('')}</details>`};
const _st=V.stats;V.stats=function(){const h=_st.call(V),on=typeof XT=='undefined'||!['reg','imp','ag','style','tips','indiv','syn'].includes(XT);return on?h+barsHTML()+heatPlHTML()+heatHTML():h};
/* favoris + palette */
const isFav=k=>LS('teamops_fav',[]).includes(k);
window.favT=i=>{const x=PI[i];if(!x||!x.k)return;let f=LS('teamops_fav',[]);f=f.includes(x.k)?f.filter(k=>k!=x.k):f.concat(x.k);SV('teamops_fav',f);palR()};
const fix=x=>{if(x.g=='Joueurs'){x.k='Joueurs|'+x.t;x.f=()=>fP(x.t)}else if(x.g=='Adversaires'){x.k='Adversaires|'+x.t;x.f=()=>fO(x.t)}else if(x.g=='Maps')x.f=()=>fM(x.t);return x},_pi=palItems;
palItems=function(q){const add=q[0]=='+',nq=norm(add?q.slice(1):q),r=_pi(q).map(fix);if(add)return r;const ex=[{g:'Affichage',t:'Changer la couleur d’accent',s:'Rouge, cyan, violet, vert, or',ic:'◐',f:accNext},{g:'Affichage',t:'Carte thermique de l’équipe',s:'K/D par joueur, par agent et par map',ic:'▦',f:fT}];if(nq)return r.concat(ex.filter(x=>norm(x.t+x.s).includes(nq)));const fv=LS('teamops_fav',[]).map(k=>{const [g,t]=k.split('|');return _pi(t).map(fix).find(x=>x.g==g&&x.t==t)}).filter(Boolean).map(x=>Object.assign({},x,{g:'Favoris'}));return fv.concat(r,ex)};
palR=function(){PI=palItems($('pq').value);let last='';$('pl').innerHTML=PI.map((x,i)=>{const h=x.g!=last?`<div class="gl">${x.g}</div>`:'';last=x.g;return h+`<div class="pi${i==PS?' on':''}" onmouseenter="palS(${i})" onclick="palGo(${i})"><i>${x.ic}</i><b>${esc(x.t)}</b><span class="m">${esc(x.s)}</span>${x.k?`<span onclick="event.stopPropagation();favT(${i})" title="Favori" style="margin-left:auto;cursor:pointer;color:var(--r)">${isFav(x.k)?'★':'☆'}</span>`:''}</div>`}).join('')||'<div class="m" style="padding:14px">Aucun résultat</div>'};
})();
</script>
<script>
/* ===== PLAYER CARD ANNUELLE (v2.2.1) : onglet « Carte annuelle » dans la page Cartes =====
   Lit S.players / S.matches sans rien modifier. Les choix manuels (agent, visuel) sont gardés
   à part dans localStorage (teamops_pc_v1) : ils ne touchent pas à la sauvegarde du site. */
(function(){
'use strict';
if(typeof V==='undefined'||typeof S==='undefined'||typeof A==='undefined'||typeof V.cards!=='function')return;
const W=900,H=1260,RED='#ff4655',LSK='teamops_pc_v1',AGK='teamops_pc_ag1',MINAUTO=3,MINBADGE=5,
FONT='"Bahnschrift","Arial Narrow","Segoe UI",Arial,sans-serif';

/* ---------- Ambiances par agent : [couleur 1, couleur 2, motif] ---------- */
const PAL={Jett:['#7fd4ff','#eafaff','wind'],Reyna:['#c24dff','#ff6fe0','orbs'],Raze:['#ff9a1f','#ffd34d','burst'],Phoenix:['#ff6a2b','#ffc04a','fire'],Neon:['#2f6bff','#19e6ff','bolt'],Yoru:['#3b5bff','#8ea2ff','rift'],Iso:['#7b5cff','#d9c9ff','hex'],Waylay:['#ffe14a','#ff8fd0','wind'],
Sova:['#4aa8ff','#b5dcff','radar'],Breach:['#ff7a2e','#ffc27a','burst'],Skye:['#5fd97a','#d3ffc9','leaf'],'KAY/O':['#3de0e0','#ffffff','grid'],Fade:['#8a52b8','#d2aef0','smoke'],Gekko:['#9be54a','#e8ff9a','bubbles'],Tejo:['#e8a23a','#fff0c2','radar'],
Brimstone:['#ff8f2a','#ffd08a','smoke'],Omen:['#6a58d6','#bdb2ff','smoke'],Viper:['#3ed35f','#c6ffd0','bubbles'],Astra:['#8a5cf6','#ff9bf0','stars'],Harbor:['#21b8c9','#9af0ff','waves'],Clove:['#ff7eb6','#ffd1e6','leaf'],Miks:['#ff5fa8','#ffc2e0','waves'],
Sage:['#3ee0b8','#c2fff0','rings'],Cypher:['#cfd5e0','#7f8aa3','grid'],Killjoy:['#ffdc3c','#fff3a8','grid'],Chamber:['#e2b44a','#fff0b8','rings'],Deadlock:['#6fb0c8','#d6f2ff','hex'],Vyse:['#9aa9c4','#e3ecff','blades'],Veto:['#b86bff','#ead2ff','blades']};
const RPAL={D:['#ff7a45','#ffd0b8','burst'],I:['#4aa8ff','#cde8ff','radar'],C:['#8a6cff','#d8ceff','smoke'],S:['#3ee0b8','#c9fff3','rings'],X:['#cfd6e6','#7f8aa3','grid']};

/* ---------- État de l’onglet (jamais dans S) ---------- */
const ST={year:'',sel:'',pref:{}};
try{const o=JSON.parse(localStorage[LSK]||'{}');if(o&&typeof o==='object'){ST.pref=o.pref&&typeof o.pref==='object'?o.pref:{};ST.year=String(o.year||'');ST.sel=String(o.sel||'')}}catch(e){}
const persist=()=>{try{localStorage[LSK]=JSON.stringify({pref:ST.pref,year:ST.year,sel:ST.sel})}catch(e){}};

/* ---------- Petits utilitaires ---------- */
const ok=v=>v!=null&&v!==''&&!isNaN(+v);
const sum=(L,f)=>L.reduce((a,x)=>a+(+f(x)||0),0);
const mean=(L,f)=>{const v=L.map(f).filter(ok).map(Number);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const AGN=Object.keys(AG);
const canon=n=>{const k=norm(n);if(!k)return'';return AGN.find(a=>norm(a)==k)||String(n).trim()};
const roleOf=ag=>(AG[ag]&&AG[ag][0])||'X';
const rgba=(hex,al)=>{let h=String(hex||'#fff').replace('#','');if(h.length==3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h.slice(0,6),16)||0;return`rgba(${n>>16&255},${n>>8&255},${n&255},${al})`};
const rng=seed=>{let a=0;for(const ch of String(seed))a=(a*31+ch.charCodeAt(0))|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const file=(p,y)=>'twixx-playercard-'+norm(p.name)+'-'+(y==='all'?'toutes-saisons':y)+'.png';
const rosterOf=()=>S.players.filter(p=>!p.demo||S.players.length<=1).slice().sort((a,b)=>(b.active!==false)-(a.active!==false)||String(a.name).localeCompare(String(b.name)));
const yearsOf=()=>[...new Set(S.matches.filter(m=>(m.stats||[]).some(s=>s.k!=null&&s.k!=='')).map(m=>String(m.date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort().reverse();
const mvpOf=m=>{const st=(m.stats||[]).filter(s=>ok(s.k));if(st.length<2)return null;return st.map(s=>({n:s.n,v:(+s.k||0)/Math.max(1,+s.d||0),k:+s.k||0})).sort((a,b)=>b.v-a.v||b.k-a.k)[0].n};
const masTop=p=>{let o=p&&p.mast,best='',bv=-1;if(typeof o==='string'){const t={};o.split(',').forEach(x=>{const[a,l]=x.split(':').map(z=>z.trim());if(a&&l!==undefined&&l!=='')t[a]=+l});o=t}
 if(!o||typeof o!=='object')return'';Object.keys(o).forEach(k=>{const v=+o[k];const c=canon(k);if(AG[c]&&!isNaN(v)&&v>bv){bv=v;best=c}});return best};

/* ---------- Illustrations officielles (valorant-api), avec cache et repli ---------- */
let AGD={};try{AGD=JSON.parse(localStorage[AGK]||'{}')||{}}catch(e){AGD={}}
let AGP=null;
function loadAgents(){if(AGP)return AGP;AGP=Promise.race([fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true').then(r=>r.json()),new Promise((_,rj)=>setTimeout(()=>rj(0),6000))]).then(j=>{const o={};(j.data||[]).forEach(a=>{o[canon(a.displayName)]={fp:a.fullPortraitV2||a.fullPortrait||a.bustPortrait||'',bg:a.background||'',g:(a.backgroundGradientColors||[]).slice(0,2).map(c=>'#'+String(c).slice(0,6))}});if(Object.keys(o).length){AGD=o;try{localStorage[AGK]=JSON.stringify(o)}catch(e){}}}).catch(()=>{});return AGP}
const IM={},IMR={};
function loadImg(u){if(!u)return Promise.resolve(null);if(IMR[u])return Promise.resolve(IMR[u]);if(IM[u])return IM[u];IM[u]=new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{IMR[u]=i;res(i)};i.onerror=()=>{delete IM[u];res(null)};i.src=u});return IM[u]}
const wants=M=>{const d=AGD[M.ag]||{},L=[];if(M.vis=='photo'||M.med){if(M.p.photo&&/^data:image/.test(M.p.photo))L.push(M.p.photo)}if(M.vis!='photo'){if(d.fp)L.push(d.fp);if(d.bg)L.push(d.bg)}return L};
const imgsNow=M=>{const d=AGD[M.ag]||{};return{fp:IMR[d.fp]||null,bg:IMR[d.bg]||null,ph:IMR[M.p.photo]||null}};

/* ---------- Calcul : uniquement à partir des stats réellement saisies ---------- */
function agg(R,p){
 const n=R.length,dec=R.map(r=>resOf(r.m.score,r.m.res)).filter(x=>x==='V'||x==='D'||x==='N'),dr=R.filter(r=>ok(r.s.d)),sd=sum(dr,r=>r.s.d),cmp=R.filter(r=>mvpOf(r.m)!=null);
 const pick=f=>{const L=R.filter(r=>ok(r.s[f]));return L.length?L:null};
 const tot=f=>{const L=pick(f);return L?sum(L,r=>r.s[f]):null};
 return{n,wr:dec.length?dec.filter(x=>x==='V').length/dec.length:null,wn:dec.length,
  kd:sd>0?sum(dr,r=>r.s.k)/sd:null,kills:sum(R,r=>r.s.k),a:tot('a'),
  adr:mean(R,r=>r.s.adr),acs:mean(R,r=>r.s.acs),kast:mean(R,r=>r.s.kast),hs:mean(R,r=>r.s.hs),
  fk:tot('fk'),ace:tot('ace'),mvp:cmp.filter(r=>norm(mvpOf(r.m)||'')==norm(p.name)).length,mvpN:cmp.length}}

function model(p,year){
 const ms=S.matches.filter(m=>year==='all'||String(m.date||'').slice(0,4)===year);
 const rows=ms.map(m=>{const s=(m.stats||[]).find(x=>norm(x.n)==norm(p.name)&&ok(x.k));return s?{m,s}:null}).filter(Boolean).sort((a,b)=>String(a.m.date).localeCompare(String(b.m.date)));
 const by={};rows.forEach(r=>{const a=canon(r.s.ag);if(!a)return;(by[a]=by[a]||[]).push(r)});
 const list=Object.entries(by).map(([name,R])=>({name,R,n:R.length,w:R.filter(r=>resOf(r.m.score,r.m.res)==='V').length,kd:(()=>{const d=sum(R.filter(r=>ok(r.s.d)),r=>r.s.d);return d?sum(R.filter(r=>ok(r.s.d)),r=>r.s.k)/d:0})()})).sort((a,b)=>b.n-a.n||b.w-a.w||b.kd-a.kd);
 const tagged=sum(list,x=>x.n),top=list[0]||null,tie=!!(top&&list[1]&&list[1].n===top.n&&list[1].w===top.w&&Math.abs(list[1].kd-top.kd)<1e-9);
 const pf=ST.pref[year+'|'+p.id]||{};let ag='',src='none';
 if(pf.ag&&AG[canon(pf.ag)]){ag=canon(pf.ag);src='manual'}
 else if(top){ag=top.name;src=top.n>=MINAUTO?'auto':'low'}
 else{const mt=masTop(p);if(mt){ag=mt;src='mast'}}
 const sel=ag&&by[ag]?by[ag]:null,use=sel||rows,scope=sel?'agent':rows.length?'all':'none',st=agg(use,p),a=list.find(x=>x.name===ag)||null;
 const vis=pf.vis=='photo'&&p.photo&&/^data:image/.test(p.photo)?'photo':'agent',med=vis=='agent'&&pf.med&&p.photo&&/^data:image/.test(p.photo)?1:0;
 /* Badges : seulement si les chiffres le justifient */
 const bd=[];
 if(a&&top&&a.name===top.name&&!tie&&a.n>=MINBADGE&&tagged&&a.n/tagged>=.4)bd.push(year==='all'?'MAIN HISTORIQUE':'MAIN DE L’ANNÉE');
 if(a&&a.n>=MINBADGE){if(st.kd!=null&&st.kd>=1.3)bd.push('MACHINE À KILLS');if(st.wr!=null&&st.wn>=MINBADGE&&st.wr>=.65)bd.push('MUR DE VICTOIRES');if(st.mvp>=3)bd.push('MVP RÉCURRENT');if(tagged&&a.n>=8&&a.n/tagged>=.7)bd.push('ONE-TRICK')}
 /* Tuiles : 3 fixes + 5 parmi les stats disponibles (remplacement si une stat manque) */
 const rd=v=>v==null?null:String(Math.round(v)),opt=[['ACS',rd(st.acs)],['ADR',rd(st.adr)],['KILLS',st.n?String(st.kills):null],['MVP',st.mvpN?String(st.mvp):null],['KAST',st.kast==null?null:rd(st.kast)+'%'],['HS%',st.hs==null?null:rd(st.hs)+'%'],['FK',st.fk==null?null:String(st.fk)],['ACES',st.ace==null?null:String(st.ace)],['ASSISTS',st.a==null?null:String(st.a)]];
 const got=opt.filter(o=>o[1]!=null).slice(0,5),miss=opt.filter(o=>o[1]==null);while(got.length<5&&miss.length){const x=miss.shift();got.push([x[0],'N/D'])}
 const tiles=[['MATCHS',st.n?String(st.n):'—'],['WIN RATE',st.wr==null?'—':Math.round(st.wr*100)+'%'],['K/D',st.kd==null?'—':st.kd.toFixed(2)]].concat(got);
 const pal=pickPal(ag,roleOf(ag)),notes=[];
 if(scope=='all'&&ag)notes.push(`Aucun match avec ${ag} sur cette période : la carte affiche les stats de toutes les parties du joueur.`);
 if(!rows.length)notes.push('Aucune stat saisie pour ce joueur sur cette période : les valeurs restent vides.');
 else if(!tagged)notes.push('Les agents ne sont pas renseignés dans les stats : choisis l’agent à la main.');
 if(rows.length&&st.acs==null)notes.push('ACS : non saisi dans les matchs, remplacé par une autre stat.');

if(!window.__pcTilt){window.__pcTilt=1;

 if(M.src=='low')return`Peu de données (${a.n} match${a.n>1?'s':''} avec <b>${esc(M.ag)}</b>) : agent proposé, tu peux le changer.${M.tie?' Égalité avec un autre agent.':''}`;

function body(){

 const info=`<div class="pc-side"><h3>${esc(p.name)} <span class="m" style="font-weight:400">· ${esc(M.label.toLowerCase())}</span></h3>

 <div class="row"><label class="m">Visuel</label><select onchange="A.pcVis(this.value)"><option value="agent" ${M.vis=='agent'?'selected':''}>Illustration de l’agent</option><option value="photo" ${M.vis=='photo'?'selected':''} ${hasPh?'':'disabled'}>Photo du joueur${hasPh?'':' (aucune photo)'}</option></select>${hasPh&&M.vis=='agent'?`<label class="m" style="cursor:pointer"><input type="checkbox" ${M.med?'checked':''} onchange="A.pcMed(this.checked)"> Photo en médaillon</label>`:''}</div>

 const th=R.map(q=>{const m=model(q,ST.year);return`<button class="pc-th ${q.id==p.id?'on':''}" onclick="A.pcSel('${esc(q.id)}')" aria-label="Voir la carte de ${esc(q.name)}"><canvas data-pc="${esc(q.id)}" width="360" height="504"></canvas><span><b>${esc(q.name)}</b>${m.ag?esc(m.ag):'Agent à choisir'}${q.active===false?' · remplaçant':''}</span></button>`}).join('');

/* ---------- Branchement : nouvel onglet dans la page Cartes (les autres restent identiques) ---------- */
const _cards=V.cards;

  if(on){CDT='rules';try{h=_cards.apply(this,arguments)}finally{CDT='pcard'}}else h=_cards.apply(this,arguments);

<script>

try{const _d=V.dash;V.dash=function(){const h=_d.apply(this,arguments);return typeof h==='string'?'<div class="row" style="margin:0 0 12px"><button onclick="A.v30()" title="Un coup d’œil rapide sur chaque joueur">⏱ Résumé 30 secondes</button></div>'+h:h}}catch(e){}

st.textContent='.tc-big{font-size:15px;margin:2px 0 4px}.tc-big b{font-size:36px;color:#f0c542;font-weight:900;margin-right:6px}.tc-ev div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--bd)}.tc-ev b{color:#f0c542;white-space:nowrap}.tc-ev b.neg{color:#ff6b6b}.tc-d summary{cursor:pointer;margin:10px 0 6px;font-weight:700;font-size:13px}';
document.head.appendChild(st);
const CC=new Map();let CV=-1,CT=0;
function coinsOf(p){const v=window.CDV|0,n=Date.now();if(v!==CV||n-CT>5000){CC.clear();CV=v;CT=n}if(CC.has(p.id))return CC.get(p.id);const r=coinsRaw(p);CC.set(p.id,r);return r}
function coinsRaw(p){const ev=[];
 const rows=cdRows(p);
 rows.forEach(({m,s})=>{const d=m.date||'',vs=' · vs '+(m.opp||'?'),imp=isImp(m);
  ev.push({d,n:imp?15:10,w:(imp?'Match important joué':'Match joué')+vs});
  if(m.res=='V')ev.push({d,n:5,w:'Victoire'+vs});
  const kd=cdOk(s.k)&&cdOk(s.d)?kdOf(s):null;
  if(kd!=null&&kd>=1.5)ev.push({d,n:20,w:'Grosse perf, K/D '+kd.toFixed(2)+vs});
  else if(kd!=null&&kd>=1.2)ev.push({d,n:10,w:'Bonne perf, K/D '+kd.toFixed(2)+vs});
  if(cdOk(s.adr)&&+s.adr>=160)ev.push({d,n:5,w:'ADR '+Math.round(s.adr)+vs});
  try{if(norm(mvpOf(m)||'')==norm(p.name))ev.push({d,n:15,w:'MVP du match'+vs})}catch(e){}
  const a=Math.min(5,+s.ace||0);if(a>0)ev.push({d,n:10*a,w:a+' ace'+(a>1?'s':'')+vs})});
 (S.moments||[]).filter(mo=>mo.pid==p.id).forEach(mo=>{const m=S.matches.find(x=>x.id==mo.mid);
  if(mo.ace&&m&&rows.some(r=>r.m.id==m.id&&+r.s.ace>0))return;
  ev.push({d:mo.date||(m&&m.date)||'',n:mo.ace?10*Math.max(1,Math.min(5,+mo.n||1)):10,w:mo.ace?'Carte Ace':(mo.kind||'Clutch')+(mo.sit?' '+mo.sit:'')})});
 (S.coinAdj||[]).filter(a=>a.pid==p.id).forEach(a=>ev.push({d:a.date||'',n:+a.n||0,w:a.why||'Ajustement admin'}));
 ev.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
 const now=ymd(new Date()).slice(0,7),tot=ev.reduce((a,e)=>a+e.n,0),mo=ev.filter(e=>String(e.d).slice(0,7)==now).reduce((a,e)=>a+e.n,0);
 return{total:Math.max(0,tot),month:mo,ev}}
window.coinsOf=coinsOf;
window.coinsBlock=function(){try{
 if(typeof USER=='undefined'||!USER||isGuest())return'';
 const p=S.players.find(x=>norm(x.name)==norm(USER.name));if(!p&&!canEdit())return'';
 const all=cdTeam().map(x=>({p:x.p,t:coinsOf(x.p).total})).filter(x=>x.p.active!==false||x.t>0).sort((a,b)=>b.t-a.t);
 const c=p?coinsOf(p):null,pos=p?all.findIndex(x=>x.p.id==p.id)+1:0,csd=p&&window.csGet?window.csGet(p.id).d:0,tot=c?Math.max(0,c.total+csd):0;
 const row=e=>`<div><span>${esc(e.w)}${e.d?' <span class="m">'+cdDate(e.d)+'</span>':''}</span><b class="${e.n<0?'neg':''}">${e.n>0?'+':''}${e.n}</b></div>`;
 return`<div class="pf-card"><div class="pf-t">🪙 TWIXX coins</div>${c?`<div class="tc-big"><b>${tot}</b>coins</div><div class="m" style="margin-bottom:8px">${c.month>=0?'+':''}${c.month} ce mois-ci${pos?' · #'+pos+' de l’équipe':''}</div><div class="tc-ev">${c.ev.length?c.ev.slice(0,5).map(row).join(''):'<span class="m">Pas encore de coins : ils arrivent avec tes premiers matchs saisis.</span>'}</div>`:'<div class="m">Aucun joueur lié à ton compte.</div>'}
 <details class="tc-d"><summary>Classement et barème</summary>${all.slice(0,5).map((x,i)=>`<div class="ro" style="display:flex;justify-content:space-between;padding:3px 0"><span>${i+1}. ${esc(x.p.name)}</span><b style="color:#f0c542">${x.t}</b></div>`).join('')||'<span class="m">Aucun joueur.</span>'}
 <div class="m" style="margin-top:8px;line-height:1.6">Match joué +10 (+15 si important) · victoire +5 · K/D 1,2 et + : +10 (1,5 et + : +20) · ADR 160 et + : +5 · MVP du match +15 · ace +10 chacun · carte Clutch ou Ace +10. Les coins se calculent tout seuls à partir des matchs saisis.</div></details>
 ${canEdit()?'<div class="row" style="margin:10px 0 0"><button type="button" onclick="A.coinAdj()">Ajuster les coins (admin)</button></div>':''}</div>`}catch(e){return''}};
A.coinAdj=()=>{if(!canEdit())return deny();const pl=S.players.filter(x=>!x.demo||S.players.length<=1);if(!pl.length)return toast('Aucun joueur');
 modal('Ajuster les TWIXX coins',[{k:'pl',l:'Joueur',t:'sel',o:pl.map(x=>x.name)},{k:'n',l:'Montant (négatif pour retirer)'},{k:'why',l:'Raison (ex : bonne attitude, défi gagné)'}],{pl:pl[0].name,n:'10',why:''},
  o=>{const p=pl.find(x=>x.name==o.pl),n=parseInt(o.n,10);if(!p||!n)return false;
   if(!Array.isArray(S.coinAdj))S.coinAdj=[];S.coinAdj.push({id:uid(),pid:p.id,n:Math.max(-5000,Math.min(5000,n)),why:String(o.why||'').slice(0,80),date:ymd(new Date())});
   save();render(1);toast('Coins ajustés')})};
})();

(function(){
const st=document.createElement('style');
st.textContent='.cs-top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.cs-bal{font-size:34px;font-weight:900;color:#f0c542}.cs-bet{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}.cs-bet button{min-width:44px}.cs-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:14px 0}.cs-g .c{margin:0}.cs-reels{display:flex;gap:8px;justify-content:center;margin:12px 0}.cs-reels span{width:64px;height:72px;display:flex;align-items:center;justify-content:center;font-size:38px;border-radius:12px;border:1px solid var(--bd);background:var(--p2)}.cs-res{min-height:44px;text-align:center;font-weight:800;font-size:15px;margin:8px 0;display:flex;align-items:center;justify-content:center}.cs-res.win{color:#46d39a}.cs-res.lose{color:#ff6672}.cs-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.cs-row button{flex:1 1 80px}.cs-big{font-size:44px;text-align:center;min-height:56px}.cs-log div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--bd)}.cs-log b.pos{color:#46d39a}.cs-log b.neg{color:#ff6672}';

const SY=[...Array(5).fill('🍒'),...Array(4).fill('🍋'),...Array(3).fill('🔔'),...Array(2).fill('💎'),'7️⃣'],PAY={'🍒':6,'🍋':8,'🔔':15,'💎':40,'7️⃣':150},REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
window.CSBET=window.CSBET||10;let busy=false;
const t2=ts=>new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function logHtml(l){return l.log.length?l.log.map(e=>`<div><span>${t2(e.t)} · ${esc(e.g)}${e.b?' · mise '+e.b:''}</span><b class="${e.n>=0?'pos':'neg'}">${e.n>=0?'+':''}${e.n}</b></div>`).join(''):'<span class="m">Aucune partie pour l’instant.</span>'}
function refresh(){const w=who(),l=window.csGet(w.id),b=document.getElementById('cs-bal'),g=document.getElementById('cs-log');if(b)b.textContent=bal(w,l);if(g)g.innerHTML=logHtml(l);const d=document.getElementById('cs-daily');if(d)d.style.display=l.day==ymd(new Date())?'none':''}

function start(game){if(busy)return null;const w=who(),l=window.csGet(w.id),b=bal(w,l);
 if(b<5){toast('Pas assez de coins (mise minimum 5). Passe chercher ton cadeau du jour !');return null}
 const bet=Math.min(window.CSBET,b);if(window.CSBET>b)toast('Mise ramenée à ton solde : '+bet);
 return{w,l,bet,game}}
function settle(c,mult){const pay=Math.round(c.bet*mult),net=pay-c.bet;c.l.d+=net;c.l.log.unshift({t:Date.now(),g:c.game,b:c.bet,n:net});c.l.log=c.l.log.slice(0,8);csSet(c.w.id,c.l);return net}
function show(el,net){if(!el)return;el.className='cs-res '+(net>0?'win':net<0?'lose':'');el.textContent=net>0?'Gagné ! +'+net+' coins':net<0?'Perdu : '+net+' coins':'Mise remboursée'}

A.csSlots=()=>{const c=start('Machine à sous');if(!c)return;busy=true;
 const f=[SY[rnd(SY.length)],SY[rnd(SY.length)],SY[rnd(SY.length)]];let m=0;
 if(f[0]==f[1]&&f[1]==f[2])m=PAY[f[0]];else if([...new Set(f)].length==2){const x=f.find(a=>f.filter(b=>b==a).length==2);if(x=='🍒')m=1}
 const net=settle(c,m),R=[0,1,2].map(i=>document.getElementById('cs-r'+i)),res=document.getElementById('cs-slot-res');if(res){res.className='cs-res';res.textContent='…'}
 const it=setInterval(()=>R.forEach(e=>{if(e)e.textContent=SY[rnd(SY.length)]}),80);
 setTimeout(()=>{clearInterval(it);R.forEach((e,i)=>{if(e)e.textContent=f[i]});show(res,net);busy=false;refresh()},1000)};
A.csRoul=k=>{const c=start('Roulette');if(!c)return;busy=true;
 const n=rnd(37),col=n==0?'V':REDS.includes(n)?'R':'N',m=k==col?(k=='V'?36:2):0,net=settle(c,m),el=document.getElementById('cs-roul'),res=document.getElementById('cs-roul-res');if(res){res.className='cs-res';res.textContent='…'}
 const it=setInterval(()=>{if(el)el.textContent=rnd(37)},70);
 setTimeout(()=>{clearInterval(it);if(el)el.innerHTML=`<span style="color:${col=='R'?'#ff4655':col=='V'?'#46d39a':'#fff'}">${n} ${col=='R'?'🔴':col=='V'?'🟢':'⚫'}</span>`;show(res,net);busy=false;refresh()},1100)};
A.csFlip=k=>{const c=start('Pile ou face');if(!c)return;busy=true;
 const r=rnd(2)?'P':'F',m=k==r?1.9:0,net=settle(c,m),el=document.getElementById('cs-flip'),res=document.getElementById('cs-flip-res');if(res){res.className='cs-res';res.textContent='…'}
 let i=0;const it=setInterval(()=>{if(el)el.textContent=(i++%2)?'🪙':'⚪'},120);
 setTimeout(()=>{clearInterval(it);if(el)el.textContent=r=='P'?'🪙 Pile':'⚪ Face';show(res,net);busy=false;refresh()},900)};
A.csDaily=()=>{const w=who(),l=window.csGet(w.id),td=ymd(new Date());if(l.day==td)return toast('Cadeau déjà récupéré aujourd’hui');
 l.d+=10;l.day=td;l.log.unshift({t:Date.now(),g:'Cadeau du jour',b:0,n:10});l.log=l.log.slice(0,8);csSet(w.id,l);toast('+10 coins !');refresh()};

 if(!USER||isGuest())return'<div class="c m">Réservé aux membres connectés.</div>';
 const w=who(),l=window.csGet(w.id),b=bal(w,l),td=ymd(new Date());
 return`<div class="c cs-top"><div><div class="m">Solde${w.p?'':' · mode test (aucun joueur lié à ton compte)'}</div><div class="cs-bal">🪙 <b id="cs-bal">${b}</b></div></div><div class="cs-bet">Mise ${[5,10,25,50,100].map(v=>`<button type="button" data-b="${v}" class="${window.CSBET==v?'p':''}" onclick="A.csBet(${v})">${v}</button>`).join('')}</div></div>
 <div class="m" style="line-height:1.6">Jeu fictif entre coéquipiers : les TWIXX coins n’ont aucune valeur réelle. Tes gains et pertes du casino sont gardés sur cet appareil.</div>
